<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מַעֲרָךְ · מחברת המורה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Assistant:wght@400;600;700&family=Suez+One&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2747d6; --ink-d:#1b33a3; --coral:#ff5a4e; --lime:#d8f55a;
  --text:#1d2233; --muted:#5b6175; --line:#dfe5f7; --paper:#fff;
  --head:"Suez One", system-ui, sans-serif;
  --hand:"Amatic SC", "Assistant", system-ui, sans-serif;
  --body:"Assistant", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--body); color:var(--text); font-size:17px; line-height:1.6;
  background-color:#fff;
  background-image:
    linear-gradient(to right, rgba(39,71,214,.07) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(39,71,214,.07) 1px, transparent 1px);
  background-size:24px 24px;
  overflow-x:hidden; min-height:100vh;
}
a{color:var(--ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* ---------- nav ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.93);backdrop-filter:blur(4px);border-bottom:2px solid var(--ink)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;flex-wrap:wrap}
.logo{font-family:var(--head);font-size:26px;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:8px}
.logo small{font-family:var(--hand);font-size:22px;color:var(--coral);transform:rotate(-4deg);display:inline-block}
.nav{display:flex;gap:4px;flex-wrap:wrap;margin:0;padding:0;list-style:none}
.nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;text-decoration:none;color:var(--text);font-weight:600;border-radius:8px}
.nav a:hover{color:var(--ink);background:rgba(39,71,214,.06)}
.nav a[aria-current="page"]{color:var(--ink)}

/* ---------- signature: highlighter swipe ---------- */
.hl{position:relative;z-index:0}
.hl::before{
  content:"";position:absolute;z-index:-1;inset:18% -6px 8% -6px;
  background:var(--lime);border-radius:3px 10px 4px 12px / 8px 4px 10px 4px;
  transform:scaleX(0) skewX(-6deg);transform-origin:right center;opacity:.95;
}
.is-on .hl::before,.hl.is-on::before{animation:swipe .55s cubic-bezier(.6,.05,.3,1) forwards}
@keyframes swipe{to{transform:scaleX(1) skewX(-6deg)}}

/* ---------- home ---------- */
.home{padding:44px 0 70px}
.hero{display:grid;grid-template-columns:1.25fr .9fr;gap:40px;align-items:start}
.kicker{font-family:var(--hand);font-size:30px;color:var(--coral);margin:0 0 4px;transform:rotate(-2deg);display:inline-block}
h1{font-family:var(--head);font-weight:400;color:var(--ink);font-size:clamp(34px,6vw,60px);line-height:1.12;margin:0}
.scrib{display:block;width:min(340px,80%);height:18px;margin:6px 0 18px}
.lead{font-size:19px;max-width:34em;margin:0 0 6px;color:var(--text)}
.stats{margin-top:26px;display:flex;gap:28px;flex-wrap:wrap;align-items:center}
.stat{display:flex;align-items:center;gap:10px}
.circled{position:relative;font-family:var(--head);font-size:34px;color:var(--ink);padding:6px 16px;line-height:1}
.circled svg{position:absolute;inset:-10px -12px;width:calc(100% + 24px);height:calc(100% + 20px);overflow:visible}
.stat span.lbl{font-weight:600;color:var(--muted);line-height:1.25}
.side-note{margin-top:22px;background:#fff;border:2px dashed var(--ink);border-radius:14px;padding:14px 18px;max-width:420px;transform:rotate(-1deg)}
.side-note b{font-family:var(--hand);font-size:24px;color:var(--coral);display:block;line-height:1}
.side-note p{margin:4px 0 0;color:var(--muted);font-size:15.5px}

.picker{position:relative}
.step{position:relative;margin-bottom:26px}
.step-h{display:flex;align-items:baseline;gap:10px;margin:0 0 12px;font-family:var(--head);font-weight:400;color:var(--text);font-size:21px}
.step-h .n{font-family:var(--hand);font-size:34px;color:var(--coral);line-height:1}
.notes{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.note{
  border:0;cursor:pointer;min-height:132px;padding:16px 14px 14px;text-align:right;
  display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:0 10px 18px -12px rgba(20,30,80,.45), 0 1px 0 rgba(0,0,0,.05);
  transition:transform .2s ease, box-shadow .2s ease;position:relative;
}
.note::after{content:"";position:absolute;top:-9px;right:50%;width:58px;height:18px;transform:translateX(50%) rotate(-3deg);background:rgba(255,255,255,.65);border:1px solid rgba(0,0,0,.06)}
.note:nth-child(1){background:#fff4a8;transform:rotate(-3deg)}
.note:nth-child(2){background:#ffd0cb;transform:rotate(2deg) translateY(10px)}
.note:nth-child(3){background:#cfe0ff;transform:rotate(-1.5deg)}
.note:hover{transform:rotate(0) translateY(-3px)}
.note .nm{font-family:var(--head);font-size:30px;line-height:1.1;align-self:flex-start}
.note .ct{font-size:15px;color:var(--muted);font-weight:600}
.note[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink), 0 14px 22px -12px rgba(20,30,80,.55)}
.arrow{position:absolute;left:-6px;top:-40px;width:110px;height:70px;pointer-events:none;color:var(--coral)}
.stickers{display:flex;flex-wrap:wrap;gap:12px 14px;align-items:center}
.grp-lbl{font-family:var(--hand);font-size:22px;color:var(--muted);width:100%;margin:2px 0 -4px;line-height:1}
.sticker{
  width:60px;height:60px;border-radius:50%;border:2.5px solid var(--ink);background:#fff;cursor:pointer;
  font-family:var(--head);font-size:22px;color:var(--ink);display:grid;place-items:center;
  box-shadow:2px 3px 0 var(--ink);transition:transform .15s ease, background .15s;
}
.sticker:hover{transform:rotate(-8deg) scale(1.05)}
.sticker[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:2px 3px 0 var(--coral)}
.go{
  margin-top:8px;display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 24px;
  background:var(--coral);color:#fff;border:0;border-radius:999px;font-weight:700;font-size:18px;cursor:pointer;
  box-shadow:3px 4px 0 var(--ink);text-decoration:none;
}
.go:hover{transform:translate(-1px,-1px);box-shadow:4px 5px 0 var(--ink)}
.go svg{width:22px;height:22px}
.choice{font-family:var(--hand);font-size:26px;color:var(--ink);margin:14px 0 4px;line-height:1.1}

/* ---------- plan ---------- */
.plan{padding:28px 0 70px}
.crumb{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:15px;color:var(--muted);margin-bottom:10px}
.crumb a{min-height:32px;display:inline-flex;align-items:center}
.plan-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px;margin-bottom:18px}
.plan-head h1{font-size:clamp(30px,5vw,46px)}
.switch{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:2px solid var(--ink);background:#fff;color:var(--ink);font-weight:700;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.chip.sm{min-width:44px;padding:0 10px}
.switch .sep{width:2px;height:28px;background:var(--line);margin:0 4px}
.overview{background:#fff;border-right:5px solid var(--coral);padding:12px 16px;margin:0 0 24px;max-width:860px;color:var(--text);box-shadow:0 1px 0 var(--line)}
.overview .meta{font-family:var(--hand);font-size:22px;color:var(--coral);line-height:1}
.plan-grid{display:grid;grid-template-columns:minmax(260px,.85fr) 1.4fr;gap:28px;align-items:start}
.units{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.unit-btn{
  width:100%;text-align:right;cursor:pointer;background:#fff;border:2px solid var(--line);border-radius:12px;
  padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;min-height:56px;
  transition:border-color .15s, transform .15s;
}
.unit-btn:hover{border-color:var(--ink)}
.unit-btn .un{grid-row:span 2;font-family:var(--head);color:var(--coral);font-size:26px;line-height:1;width:34px;text-align:center;padding-top:2px}
.unit-btn .ut{font-weight:700;line-height:1.35}
.unit-btn .um{font-family:var(--hand);font-size:21px;color:var(--ink);line-height:1}
.unit-btn.is-on{border-color:var(--ink);transform:translateX(-4px);box-shadow:4px 4px 0 var(--ink)}
.unit-panel{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:20px 22px 24px;position:relative;min-height:240px}
.unit-panel::before{content:"";position:absolute;top:0;bottom:0;right:34px;width:2px;background:rgba(255,90,78,.35)}
.unit-panel > *{position:relative}
.up-months{font-family:var(--hand);font-size:24px;color:var(--coral);line-height:1}
.unit-panel h2{font-family:var(--head);font-weight:400;font-size:26px;line-height:1.25;margin:4px 0 8px;color:var(--ink)}
.bigidea{margin:0 0 6px;color:var(--muted)}
.lessons{list-style:none;margin:16px 0 0;padding:0;counter-reset:l}
.lessons li{border-top:1px dashed var(--line)}
.lessons li:first-child{border-top:0}
.lesson-a{display:flex;gap:12px;align-items:center;min-height:52px;padding:8px 6px;text-decoration:none;color:var(--text);border-radius:8px}
.lesson-a:hover{background:rgba(216,245,90,.35)}
.lesson-a .ln{flex:0 0 34px;height:34px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:700;color:var(--ink);font-size:15px;background:#fff}
.lesson-a .lt{flex:1;font-weight:600;line-height:1.35}
.lesson-a .lm{font-size:14px;color:var(--muted);white-space:nowrap}
.lesson-na{display:flex;gap:12px;align-items:center;min-height:48px;padding:8px 6px;color:var(--muted)}
.lesson-na .ln{flex:0 0 34px;text-align:center;font-weight:700}
.msg{padding:18px;border:2px dashed var(--coral);border-radius:12px;background:#fff;color:var(--text)}
.msg b{font-family:var(--head);font-weight:400;color:var(--coral);display:block;font-size:20px}
.loading{font-family:var(--hand);font-size:26px;color:var(--ink)}

/* ---------- lesson ---------- */
.lesson-wrap{padding:24px 0 70px}
.sheet{background:#fff;max-width:820px;margin:0 auto;padding:30px 34px 40px;border:1px solid var(--line);border-radius:6px;box-shadow:0 18px 40px -30px rgba(20,30,80,.5);position:relative}
.sheet::before{content:"";position:absolute;top:0;bottom:0;right:18px;width:2px;background:rgba(255,90,78,.3)}
.sheet > *{position:relative}
.tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;max-width:820px;margin:0 auto 14px}
.btn{min-height:46px;padding:0 18px;border-radius:999px;border:2px solid var(--ink);background:#fff;color:var(--ink);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn.solid{background:var(--ink);color:#fff}
.btn svg{width:18px;height:18px}
.l-unit{font-family:var(--hand);font-size:24px;color:var(--coral);line-height:1}
.sheet h1{font-size:clamp(26px,4.5vw,36px);margin:6px 0 10px}
.l-meta{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:15.5px;margin-bottom:6px}
.l-meta b{color:var(--text)}
.sheet h2{font-family:var(--head);font-weight:400;color:var(--ink);font-size:22px;margin:30px 0 10px;display:flex;align-items:center;gap:10px}
.sheet h2 .tick{font-family:var(--hand);color:var(--coral);font-size:28px;line-height:1}
.sheet ul{padding-inline-start:22px;margin:0}
.sheet li{margin:4px 0}
.bloom{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:14px;font-weight:600;padding:2px 10px;border-radius:999px;background:#eef1fd;color:var(--ink-d)}
.stage{margin-top:18px}
.stage-h{font-weight:700;font-size:18px;margin:0 0 8px;display:flex;gap:8px;align-items:center}
.stage-h .sn{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:14px}
.act{border-right:3px solid var(--line);padding:4px 14px 10px 0;margin:0 13px 10px 0}
.act-h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.act-h strong{font-size:17px}
.act-h .min{font-size:14px;color:var(--coral);font-weight:700}
.act-h .tp{font-size:13px;color:var(--muted);font-weight:600}
.act p{margin:4px 0 0;white-space:pre-line}
.diff{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.diff div{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
.diff h3{margin:0 0 4px;font-size:15px;color:var(--ink)}
.diff p{margin:0;font-size:16px}
.qs{list-style:none;padding:0!important}
.qs li{display:flex;gap:10px;align-items:flex-start;margin:0 0 10px}
.qs .lv{flex:0 0 auto;font-size:13px;font-weight:700;color:var(--ink-d);background:var(--lime);border-radius:4px;padding:1px 8px;margin-top:3px}
.exit{background:#fbfde9;border:1.5px dashed #b5cf2e;border-radius:10px;padding:12px 14px}
.notes-t{color:var(--text)}
.pager{display:flex;justify-content:space-between;gap:10px;max-width:820px;margin:18px auto 0;flex-wrap:wrap}

footer{padding:24px 0 40px;color:var(--muted);font-size:14px}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .hero{grid-template-columns:1fr;gap:28px}
  .plan-grid{grid-template-columns:1fr}
  .arrow{display:none}
}
@media (max-width:560px){
  .wrap{padding:0 14px}
  .top .wrap{padding-top:6px;padding-bottom:4px}
  .nav{width:100%;justify-content:space-between}
  .nav a{padding:0 6px;font-size:15px}
  .notes{gap:10px}
  .note{min-height:110px;padding:14px 10px 10px}
  .note .nm{font-size:23px}
  .note .ct{font-size:13px}
  .sticker{width:52px;height:52px;font-size:19px}
  .diff{grid-template-columns:1fr}
  .sheet{padding:22px 18px 28px}
  .sheet::before{right:8px}
  .act{margin-right:4px}
  .unit-panel{padding:18px 14px}
  .unit-panel::before{display:none}
  .lesson-a .lm{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .is-on .hl::before,.hl.is-on::before{transform:scaleX(1) skewX(-6deg)}
  .scrib path,.circled path,.arrow path{stroke-dashoffset:0!important}
}
.draw{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 1s .2s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}

@media print{
  body{background:#fff;font-size:12pt}
  .top,.tools,.pager,footer,.no-print{display:none!important}
  .sheet{box-shadow:none;border:0;padding:0;max-width:none}
  .sheet::before{display:none}
  .lesson-wrap{padding:0}
  .act{break-inside:avoid}
  a{color:inherit;text-decoration:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="#/"><span>מַעֲרָךְ</span><small>מחברת המורה</small></a>
    <nav aria-label="ניווט ראשי">
      <ul class="nav">
        <li><a href="#/" data-nav="home">ראשי</a></li>

        <li><a href="../index.html#library">המערכים שלי</a></li>
        <li><a href="../index.html#tools">כלים למורה</a></li>
      </ul>
    </nav>
  </div>
</header>

<main id="app" class="wrap" tabindex="-1"></main>

<footer class="wrap">מַעֲרָךְ · מערכי שיעור לתנ״ך, ספרות ולשון · שנת הלימודים תשפ״ז</footer>

<script src="data.js"></script>
<script>
(function(){
  "use strict";
  var SUBJECTS=[
    {slug:"tanach",name:"תנ״ך",count:409},
    {slug:"sifrut",name:"ספרות",count:425},
    {slug:"lashon",name:"לשון",count:488}
  ];
  var GRADES=[{n:7,h:"ז׳"},{n:8,h:"ח׳"},{n:9,h:"ט׳"},{n:10,h:"י׳"},{n:11,h:"י״א"},{n:12,h:"י״ב"}];
  var ACT={explain:"הסבר",discuss:"דיון",group:"עבודה בקבוצות",write:"כתיבה",read:"קריאה",tps:"חשוב · זוג · שתף",game:"משחק",media:"מדיה",poll:"סקר",quiz:"בוחן",cloud:"ענן מילים",exit:"סיכום",pair:"עבודה בזוגות",debate:"ויכוח",drama:"המחזה",map:"מיפוי",station:"תחנות",stations:"תחנות",jigsaw:"פאזל קבוצתי",video:"סרטון",visual:"התבוננות",project:"פרויקט",reflect:"רפלקציה",practice:"תרגול",board:"לוח"};
  var state={subject:"sifrut",grade:10};
  var app=document.getElementById("app");

  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function subj(slug){for(var i=0;i<SUBJECTS.length;i++)if(SUBJECTS[i].slug===slug)return SUBJECTS[i];return null;}
  function grade(n){for(var i=0;i<GRADES.length;i++)if(GRADES[i].n===+n)return GRADES[i];return null;}
  function parseKey(k){var m=/^(tanach|sifrut|lashon)-(7|8|9|10|11|12)$/.exec(k||"");return m?{slug:m[1],n:+m[2]}:null;}
  function arr(x){return Array.isArray(x)?x:(x?[x]:[]);}

  /* ---------- script loading (works from file://) ---------- */
  var scriptCache={};
  function loadScript(src){
    if(scriptCache[src])return scriptCache[src];
    scriptCache[src]=new Promise(function(res,rej){
      var s=document.createElement("script");s.src=src;s.async=true;
      s.onload=function(){res();};
      s.onerror=function(){delete scriptCache[src];s.remove();rej(new Error("load "+src));};
      document.head.appendChild(s);
    });
    return scriptCache[src];
  }
  function findPlan(key){var p=window.YEAR_PLANS||[];for(var i=0;i<p.length;i++)if(p[i]&&p[i].key===key)return p[i];return null;}
  function loadPlan(key){
    var have=findPlan(key);if(have)return Promise.resolve(have);
    return loadScript("../data/"+key+".js").then(function(){var p=findPlan(key);if(!p)throw new Error("missing");return p;});
  }
  function loadMoreIndex(){return loadScript("../data/more/index.js").catch(function(){window.MORE_INDEX=window.MORE_INDEX||{};});}
  function loadUnitMore(key,ui){
    return loadMoreIndex().then(function(){
      var idx=(window.MORE_INDEX||{})[key]||[];
      if(idx.indexOf(ui+1)<0)return;
      return loadScript("../data/more/"+key+"-u"+(ui+1)+".js").catch(function(){});
    });
  }
  function unitLessons(plan,ui){
    var u=plan.units[ui]||{};var all=arr(u.lessons).concat(arr((window.YEAR_MORE||{})[plan.key+"#"+(ui+1)]));
    var seen={},out=[];
    all.forEach(function(l,i){
      if(!l)return;var k=l.outlineIndex!=null?l.outlineIndex:("x"+i);
      if(seen[k])return;seen[k]=1;out.push(l);
    });
    out.sort(function(a,b){return (a.outlineIndex||0)-(b.outlineIndex||0);});
    return out;
  }

  /* ---------- hand-drawn svg bits ---------- */
  var SCRIB='<svg class="scrib" viewBox="0 0 340 18" preserveAspectRatio="none" aria-hidden="true"><path class="draw" d="M336 9 C 280 3, 220 14, 160 8 S 50 4, 6 11 M300 14 C 240 10, 150 16, 60 13" fill="none" stroke="#ff5a4e" stroke-width="4" stroke-linecap="round"/></svg>';
  var CIRCLE='<svg viewBox="0 0 100 60" preserveAspectRatio="none" aria-hidden="true"><path class="draw" d="M86 10 C 70 2, 20 2, 8 22 C -2 42, 40 58, 70 54 C 96 50, 100 26, 80 12 C 72 6, 60 4, 52 5" fill="none" stroke="#ff5a4e" stroke-width="3" stroke-linecap="round"/></svg>';
  var ARROW='<svg class="arrow" viewBox="0 0 110 70" aria-hidden="true"><path class="draw" d="M100 8 C 70 4, 30 14, 22 56" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path class="draw" d="M10 44 L 22 58 L 34 46" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var ICON_BACK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';
  var ICON_GO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>';
  var ICON_PRINT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4v-7h16v7h-2M8 14h8v7H8z"/></svg>';

  function swipe(el){ if(!el)return; el.classList.remove("is-on"); void el.offsetWidth; el.classList.add("is-on"); }
  function setNav(which){document.querySelectorAll("[data-nav]").forEach(function(a){if(a.getAttribute("data-nav")===which)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");});}
  function msg(title,body){return '<div class="msg" role="alert"><b>'+esc(title)+'</b>'+esc(body)+'</div>';}

  /* ---------- HOME ---------- */
  function renderHome(){
    setNav("home");document.title="מַעֲרָךְ · מחברת המורה";
    var notes=SUBJECTS.map(function(s){
      return '<button type="button" class="note'+(s.slug===state.subject?" is-on":"")+'" data-subj="'+s.slug+'" aria-pressed="'+(s.slug===state.subject)+'"><span class="nm hl">'+esc(s.name)+'</span><span class="ct">'+s.count.toLocaleString("he-IL")+' שיעורים</span></button>';
    }).join("");
    function stick(list){return list.map(function(g){return '<button type="button" class="sticker'+(g.n===state.grade?" is-on":"")+'" data-grade="'+g.n+'" aria-pressed="'+(g.n===state.grade)+'" aria-label="כיתה '+g.h+'"><span class="hl">'+g.h+'</span></button>';}).join("");}
    app.innerHTML=
    '<section class="home">'+
      '<div class="hero">'+
        '<div>'+
          '<p class="kicker">תשפ״ז · ז׳ עד י״ב</p>'+
          '<h1>מערכי שיעור מוכנים<br>לתנ״ך, ספרות ולשון</h1>'+SCRIB+
          '<p class="lead">בוחרים מקצוע וכיתה, פותחים את התוכנית השנתית, ומגיעים לשיעור של מחר, מוכן להוראה או להדפסה.</p>'+
          '<div class="stats">'+
            '<div class="stat"><span class="circled">1,322'+CIRCLE+'</span><span class="lbl">מערכי שיעור<br>מלאים</span></div>'+
            '<div class="stat"><span class="circled" style="font-size:28px">18</span><span class="lbl">תוכניות<br>שנתיות</span></div>'+
            '<div class="stat"><span class="circled" style="font-size:28px">3</span><span class="lbl">מקצועות</span></div>'+
          '</div>'+
          '<div class="side-note"><b>בכל שיעור:</b><p>מטרות, חומרים, שלבים עם דקות, הבחנה לשלוש רמות, שאלות לפי רמה וכרטיס יציאה.</p></div>'+
        '</div>'+
        '<div class="picker">'+
          '<div class="step"><h2 class="step-h"><span class="n">1</span>בוחרים מקצוע</h2><div class="notes" role="group" aria-label="מקצוע">'+notes+'</div></div>'+
          '<div class="step">'+ARROW+'<h2 class="step-h"><span class="n">2</span>בוחרים כיתה</h2>'+
            '<div class="stickers" role="group" aria-label="כיתה"><span class="grp-lbl">חטיבת ביניים</span>'+stick(GRADES.slice(0,3))+'<span class="grp-lbl">תיכון</span>'+stick(GRADES.slice(3))+'</div>'+
          '</div>'+
          '<p class="choice" id="choice"></p>'+
          '<a class="go" id="go" href="#">לתוכנית השנתית'+ICON_GO+'</a>'+
        '</div>'+
      '</div>'+
    '</section>';
    updateChoice();
    app.querySelectorAll("[data-subj]").forEach(function(b){b.addEventListener("click",function(){
      state.subject=b.getAttribute("data-subj");
      app.querySelectorAll("[data-subj]").forEach(function(x){var on=x===b;x.setAttribute("aria-pressed",on);x.classList.toggle("is-on",false);});
      swipe(b);updateChoice();
    });});
    app.querySelectorAll("[data-grade]").forEach(function(b){b.addEventListener("click",function(){
      state.grade=+b.getAttribute("data-grade");
      app.querySelectorAll("[data-grade]").forEach(function(x){x.setAttribute("aria-pressed",x===b);x.classList.remove("is-on");});
      swipe(b);updateChoice();
    });});
  }
  function updateChoice(){
    var c=document.getElementById("choice"),g=document.getElementById("go");if(!c)return;
    var key=state.subject+"-"+state.grade;var n=(window.UNITS&&window.UNITS[key])?window.UNITS[key].length:0;
    c.textContent=subj(state.subject).name+" · כיתה "+grade(state.grade).h+(n?" · "+n+" יחידות":"");
    g.setAttribute("href","#/plan/"+key);
  }

  /* ---------- PLAN ---------- */
  var planToken=0;
  function renderPlan(key,uiParam){
    setNav("plan");
    var pk=parseKey(key);if(!pk){key="sifrut-10";pk=parseKey(key);}
    state.subject=pk.slug;state.grade=pk.n;
    var S=subj(pk.slug),G=grade(pk.n);
    document.title=S.name+" "+G.h+" · תוכנית שנתית · מַעֲרָךְ";
    var quick=(window.UNITS&&window.UNITS[key])||[];
    var ui=uiParam!=null&&!isNaN(uiParam)?Math.max(0,Math.min(+uiParam,Math.max(quick.length-1,0))):0;
    var subjChips=SUBJECTS.map(function(s){return '<a class="chip" role="button" aria-pressed="'+(s.slug===pk.slug)+'" href="#/plan/'+s.slug+'-'+pk.n+'" style="display:inline-flex;align-items:center;text-decoration:none">'+esc(s.name)+'</a>';}).join("");
    var gradeChips=GRADES.map(function(g){return '<a class="chip sm" role="button" aria-pressed="'+(g.n===pk.n)+'" href="#/plan/'+pk.slug+'-'+g.n+'" style="display:inline-flex;align-items:center;justify-content:center;text-decoration:none" aria-label="כיתה '+g.h+'">'+g.h+'</a>';}).join("");
    app.innerHTML=
    '<section class="plan">'+
      '<div class="crumb no-print"><a href="#/">ראשי</a><span>›</span><span>תוכנית שנתית</span></div>'+
      '<div class="plan-head"><div><p class="kicker" style="margin:0">תוכנית שנתית</p><h1><span class="hl is-on">'+esc(S.name)+' · כיתה '+esc(G.h)+'</span></h1></div>'+
        '<div class="switch" aria-label="החלפת מקצוע וכיתה">'+subjChips+'<span class="sep" aria-hidden="true"></span>'+gradeChips+'</div></div>'+
      '<div id="overview"></div>'+
      '<div class="plan-grid"><ol class="units" id="units" aria-label="יחידות"></ol><div class="unit-panel" id="panel" aria-live="polite"><p class="loading">טוען את התוכנית…</p></div></div>'+
    '</section>';
    var unitsEl=document.getElementById("units");
    function drawUnits(list){
      unitsEl.innerHTML=list.map(function(u,i){
        return '<li><button type="button" class="unit-btn'+(i===ui?" is-on":"")+'" data-ui="'+i+'" aria-current="'+(i===ui?"true":"false")+'"><span class="un">'+(i+1)+'</span><span class="ut"><span class="hl">'+esc(u.t)+'</span></span><span class="um">'+esc(u.m)+'</span></button></li>';
      }).join("");
      unitsEl.querySelectorAll("[data-ui]").forEach(function(b){b.addEventListener("click",function(){
        var i=+b.getAttribute("data-ui");
        history.replaceState(null,"","#/plan/"+key+"/"+i);
        selectUnit(i,true);
      });});
    }
    drawUnits(quick.map(function(u){return {t:u.t,m:u.m};}));
    if(!quick.length)document.getElementById("panel").innerHTML='<p class="loading">טוען את התוכנית…</p>';

    var tok=++planToken,plan=null;
    function selectUnit(i,scroll){
      ui=i;
      unitsEl.querySelectorAll("[data-ui]").forEach(function(b){var on=+b.getAttribute("data-ui")===i;b.classList.remove("is-on");b.setAttribute("aria-current",on?"true":"false");if(on)swipe(b);});
      if(plan)drawPanel(scroll);
    }
    function drawPanel(scroll){
      var panel=document.getElementById("panel");var u=plan.units[ui];
      if(!u){panel.innerHTML=msg("אין יחידה כזו."," בחרו יחידה מהרשימה.");return;}
      var head='<p class="up-months">'+esc(u.months||"")+(u.weeks?" · "+esc(u.weeks)+" שבועות":"")+'</p><h2>יחידה '+(ui+1)+': '+esc(u.title)+'</h2>'+(u.bigIdea?'<p class="bigidea">'+esc(u.bigIdea)+'</p>':"");
      panel.innerHTML=head+'<p class="loading">טוען שיעורים…</p>';
      var myUi=ui;
      loadUnitMore(plan.key,ui).then(function(){
        if(tok!==planToken||myUi!==ui)return;
        var ls=unitLessons(plan,ui),byIdx={};ls.forEach(function(l){byIdx[l.outlineIndex]=l;});
        var outline=arr(u.outline),items;
        if(outline.length){
          items=outline.map(function(t,oi){
            var l=byIdx[oi+1];
            if(l)return '<li><a class="lesson-a" href="#/lesson/'+plan.key+'/'+ui+'/'+(oi+1)+'"><span class="ln">'+(oi+1)+'</span><span class="lt">'+esc(l.title||t)+'</span><span class="lm">'+esc(l.minutes||"")+' דק׳</span></a></li>';
            return '<li><div class="lesson-na"><span class="ln">'+(oi+1)+'</span><span>'+esc(t)+' <small>(מערך בהכנה)</small></span></div></li>';
          });
        }else{
          items=ls.map(function(l){return '<li><a class="lesson-a" href="#/lesson/'+plan.key+'/'+ui+'/'+l.outlineIndex+'"><span class="ln">'+esc(l.outlineIndex)+'</span><span class="lt">'+esc(l.title)+'</span><span class="lm">'+esc(l.minutes||"")+' דק׳</span></a></li>';});
        }
        panel.innerHTML=head+(items.length?'<ol class="lessons">'+items.join("")+'</ol>':msg("עדיין אין שיעורים ביחידה הזו.",""));
        if(scroll&&window.innerWidth<900)panel.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
      });
    }
    loadPlan(key).then(function(p){
      if(tok!==planToken)return;plan=p;
      var units=arr(p.units);
      drawUnits(units.map(function(u){return {t:u.title,m:u.months};}));
      if(ui>units.length-1)ui=0;
      var ov=document.getElementById("overview");
      if(p.overview)ov.innerHTML='<div class="overview"><span class="meta">'+(p.hoursPerWeek?esc(p.hoursPerWeek)+' ש״ש · ':"")+units.length+' יחידות</span><p style="margin:4px 0 0">'+esc(p.overview)+'</p></div>';
      selectUnit(ui,false);
    }).catch(function(){
      if(tok!==planToken)return;
      document.getElementById("panel").innerHTML=msg("לא הצלחנו לטעון את השיעורים."," רשימת היחידות זמינה, אבל קובץ השיעורים לא נטען. נסו לרענן את הדף.");
      var b=unitsEl.querySelector('[data-ui="'+ui+'"]');if(b)swipe(b);
    });
    var b0=unitsEl.querySelector('[data-ui="'+ui+'"]');if(b0)swipe(b0);
  }

  /* ---------- LESSON ---------- */
  function renderLesson(key,ui,oi){
    setNav("plan");
    var pk=parseKey(key);ui=+ui;oi=+oi;
    if(!pk||isNaN(ui)||isNaN(oi)){app.innerHTML='<section class="lesson-wrap">'+msg("השיעור לא נמצא."," חזרו לתוכנית השנתית ובחרו שיעור.")+'</section>';return;}
    var back="#/plan/"+key+"/"+ui;
    app.innerHTML='<section class="lesson-wrap"><p class="loading">טוען שיעור…</p></section>';
    var tok=++planToken;
    loadPlan(key).then(function(p){return loadUnitMore(key,ui).then(function(){return p;});}).then(function(p){
      if(tok!==planToken)return;
      var u=arr(p.units)[ui];var ls=u?unitLessons(p,ui):[];var l=null,pos=-1;
      ls.forEach(function(x,i){if(+x.outlineIndex===oi){l=x;pos=i;}});
      if(!l){app.innerHTML='<section class="lesson-wrap"><div class="tools"><a class="btn" href="'+back+'">'+ICON_BACK+'חזרה לתוכנית</a></div>'+msg("השיעור הזה עדיין לא זמין."," אפשר לבחור שיעור אחר מהיחידה.")+'</section>';return;}
      var S=subj(pk.slug),G=grade(pk.n);
      document.title=(l.title||"שיעור")+" · מַעֲרָךְ";
      var h='';
      h+='<div class="tools"><a class="btn" href="'+back+'">'+ICON_BACK+'חזרה לתוכנית</a><button type="button" class="btn solid" id="print">'+ICON_PRINT+'הדפסה</button></div>';
      h+='<article class="sheet">';
      h+='<p class="l-unit">'+esc(S.name)+' '+esc(G.h)+' · יחידה '+(ui+1)+' · שיעור '+oi+'</p>';
      h+='<h1>'+esc(l.title)+'</h1>';
      h+='<div class="l-meta">'+(l.minutes?'<span><b>'+esc(l.minutes)+'</b> דקות</span>':"")+'<span>'+esc(u.title)+'</span></div>';
      if(l.curriculum)h+='<p style="margin:8px 0 0"><b>תוכנית הלימודים: </b>'+esc(l.curriculum)+'</p>';
      if(arr(l.goals).length){h+='<h2><span class="tick">✓</span>מטרות</h2><ul>'+arr(l.goals).map(function(g){return '<li>'+esc(g)+'</li>';}).join("")+'</ul>';
        if(arr(l.bloom).length)h+='<div class="bloom">'+arr(l.bloom).map(function(b){return '<span class="tag">'+esc(b)+'</span>';}).join("")+'</div>';}
      if(l.materials)h+='<h2><span class="tick">✓</span>חומרים</h2><p style="margin:0">'+esc(l.materials)+'</p>';
      var st=arr(l.stages);
      if(st.length){h+='<h2><span class="tick">✓</span>מהלך השיעור</h2>';
        st.forEach(function(s,si){
          var mins=arr(s.activities).reduce(function(a,x){return a+(+x.minutes||0);},0);
          h+='<div class="stage"><h3 class="stage-h"><span class="sn">'+(si+1)+'</span>'+esc(s.name)+(mins?' <span style="font-weight:600;color:var(--muted);font-size:15px">· '+mins+' דק׳</span>':"")+'</h3>';
          arr(s.activities).forEach(function(a){
            h+='<div class="act"><div class="act-h"><strong>'+esc(a.title)+'</strong>'+(a.minutes?'<span class="min">'+esc(a.minutes)+' דק׳</span>':"")+(a.type?'<span class="tp">'+esc(ACT[a.type]||a.type)+'</span>':"")+'</div><p>'+esc(a.instructions)+'</p></div>';
          });
          h+='</div>';
        });}
      var d=l.diff||{};
      if(d.support||d.core||d.enrich){h+='<h2><span class="tick">✓</span>הבחנה</h2><div class="diff">'+
        [["support","תמיכה"],["core","ליבה"],["enrich","העשרה"]].map(function(x){return '<div><h3>'+x[1]+'</h3><p>'+esc(d[x[0]]||"—")+'</p></div>';}).join("")+'</div>';}
      if(arr(l.questions).length)h+='<h2><span class="tick">✓</span>שאלות</h2><ul class="qs">'+arr(l.questions).map(function(q){return '<li><span class="lv">'+esc(q.level||"")+'</span><span>'+esc(q.q)+'</span></li>';}).join("")+'</ul>';
      if(l.exitTicket)h+='<h2><span class="tick">✓</span>כרטיס יציאה</h2><div class="exit">'+esc(l.exitTicket)+'</div>';
      if(l.notes)h+='<h2><span class="tick">✓</span>הערות למורה</h2><p class="notes-t" style="margin:0">'+esc(l.notes)+'</p>';
      h+='</article>';
      var prev=ls[pos-1],next=ls[pos+1];
      h+='<div class="pager">'+(prev?'<a class="btn" href="#/lesson/'+key+'/'+ui+'/'+prev.outlineIndex+'">'+ICON_BACK+'השיעור הקודם</a>':'<span></span>')+(next?'<a class="btn" href="#/lesson/'+key+'/'+ui+'/'+next.outlineIndex+'">השיעור הבא'+ICON_GO+'</a>':'<span></span>')+'</div>';
      app.innerHTML='<section class="lesson-wrap">'+h+'</section>';
      document.getElementById("print").addEventListener("click",function(){window.print();});
    }).catch(function(){
      if(tok!==planToken)return;
      app.innerHTML='<section class="lesson-wrap"><div class="tools"><a class="btn" href="'+back+'">'+ICON_BACK+'חזרה לתוכנית</a></div>'+msg("לא הצלחנו לטעון את השיעור."," בדקו את החיבור ונסו לרענן את הדף.")+'</section>';
    });
  }

  /* ---------- router ---------- */
  function route(){
    var parts=(location.hash||"#/").replace(/^#\/?/,"").split("/").filter(Boolean).map(decodeURIComponent);
    try{
      if(parts[0]==="plan")renderPlan(parts[1]||"sifrut-10",parts[2]!=null?+parts[2]:null);
      else if(parts[0]==="lesson")renderLesson(parts[1],parts[2],parts[3]);
      else renderHome();
    }catch(e){app.innerHTML='<section class="plan">'+msg("משהו השתבש."," נסו לחזור לעמוד הראשי.")+'</section>';}
    window.scrollTo(0,0);
  }
  window.addEventListener("hashchange",route);
  route();
})();
</script>
</body>
</html>
