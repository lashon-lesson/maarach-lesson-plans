<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מַעֲרָךְ · מערכי שיעור לתנ״ך, ספרות ולשון</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef0fb; --card:#ffffff; --ink:#1e2150; --ink2:#3d4170; --brand:#4f5bd5; --brand-d:#3e49b8;
    --soft:#e3e6f8; --line:#dcdff3; --ans:#eef0fe;
    --tanach:#c2802b; --sifrut:#4f5bd5; --lashon:#1f9a7a;
    --r:22px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Hebrew",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:18px;line-height:1.75;font-weight:400}
  a{color:var(--brand-d)}
  :focus-visible{outline:3px solid var(--brand);outline-offset:3px;border-radius:10px}
  .skip{position:absolute;top:8px;right:8px;transform:translateY(-200%);background:#fff;padding:8px 14px;border-radius:10px;z-index:9}
  .skip:focus{transform:none}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* top nav */
  header.top{max-width:1080px;margin:0 auto;padding:18px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .logo{font-weight:800;font-size:22px;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:10px;min-height:44px}
  .logo i{width:12px;height:12px;border-radius:50%;background:var(--brand);display:inline-block}
  nav.main{display:flex;gap:4px;flex-wrap:wrap;margin-inline-start:auto}
  nav.main a{color:var(--ink2);text-decoration:none;font-size:16px;font-weight:500;padding:9px 14px;border-radius:999px;min-height:44px;display:inline-flex;align-items:center}
  nav.main a:hover{background:#fff;color:var(--ink)}
  nav.main a[aria-current="page"]{background:#fff;color:var(--ink);font-weight:700}

  main{max-width:1080px;margin:0 auto;padding:0 24px 80px}
  .view{animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* home */
  .home{min-height:calc(100vh - 160px);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:40px 0 60px;max-width:880px;margin:0 auto}
  .hello{font-size:18px;color:var(--ink2);margin:0 0 18px;font-weight:500}
  .sentence{font-size:clamp(34px,6vw,62px);line-height:1.5;font-weight:800;margin:0 0 40px;letter-spacing:-.01em}
  .pill{position:relative;display:inline-flex;align-items:center;gap:.25em;vertical-align:baseline;background:#fff;color:var(--brand);border-radius:999px;padding:.02em .5em .06em;box-shadow:0 2px 0 var(--line),0 10px 30px rgba(79,91,213,.12);cursor:pointer;transition:box-shadow .2s ease,transform .2s ease;white-space:nowrap}
  .pill:hover{box-shadow:0 2px 0 var(--line),0 14px 34px rgba(79,91,213,.2)}
  .pill:focus-within{outline:3px solid var(--brand);outline-offset:4px}
  .pill .dot{width:.28em;height:.28em;border-radius:50%;display:inline-block;margin-inline-end:.1em}
  .pill .chev{width:.42em;height:.42em;opacity:.8}
  .pill select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:18px;font-family:inherit;border:0;appearance:none}
  .go{display:inline-flex;align-items:center;gap:12px;background:var(--brand);color:#fff;text-decoration:none;font-weight:700;font-size:21px;padding:18px 34px;border-radius:999px;min-height:56px;box-shadow:0 12px 30px rgba(79,91,213,.3);transition:background .2s ease}
  .go:hover{background:var(--brand-d)}
  .go svg{width:20px;height:20px}
  .facts{margin:56px 0 0;color:var(--ink2);font-size:17px;display:flex;gap:28px;flex-wrap:wrap}
  .facts b{color:var(--ink);font-weight:800;font-size:22px;margin-inline-end:6px}
  .sub-note{font-size:17px;color:var(--ink2);margin:-20px 0 34px;max-width:60ch}

  /* plan */
  .crumbs{font-size:16px;color:var(--ink2);margin:10px 0 6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .crumbs a{color:var(--ink2);text-decoration:none;padding:8px 0;min-height:44px;display:inline-flex;align-items:center}
  .crumbs a:hover{color:var(--brand-d);text-decoration:underline}
  .phead{padding:18px 0 30px;max-width:760px}
  .phead h1{font-size:clamp(32px,5vw,48px);line-height:1.25;margin:0 0 14px;font-weight:800;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .sdot{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
  .phead p{margin:0;color:var(--ink2);max-width:68ch}
  .switch{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 0}
  .switch a{background:#fff;color:var(--ink);text-decoration:none;border-radius:999px;padding:8px 16px;min-height:44px;min-width:52px;display:inline-flex;align-items:center;justify-content:center;font-weight:500;font-size:16px}
  .switch a[aria-current="page"]{background:var(--brand);color:#fff;font-weight:700}
  .units{display:flex;flex-direction:column;gap:18px}
  .unit{background:var(--card);border-radius:var(--r);box-shadow:0 1px 2px rgba(30,33,80,.04),0 8px 28px rgba(30,33,80,.05)}
  .unit > h2{margin:0;font-size:inherit}
  .ubtn{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;padding:24px 28px;cursor:pointer;border-radius:var(--r);min-height:44px}
  .ubtn:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
  .unum{width:48px;height:48px;border-radius:16px;background:var(--soft);color:var(--brand-d);font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center}
  .utitle{font-size:21px;font-weight:700;line-height:1.45;display:block}
  .umeta{font-size:16px;color:var(--ink2);font-weight:400;display:block;margin-top:4px}
  .uchev{width:24px;height:24px;color:var(--brand);transition:transform .2s ease}
  .ubtn[aria-expanded="true"] .uchev{transform:rotate(180deg)}
  .upanel{padding:0 28px 26px}
  .upanel[hidden]{display:none}
  .bigidea{background:var(--bg);border-radius:16px;padding:16px 20px;margin:0 0 18px;color:var(--ink2);font-size:17px;max-width:72ch}
  .bigidea b{color:var(--ink)}
  ol.lessons{list-style:none;margin:0;padding:0;display:grid;gap:4px}
  ol.lessons a,ol.lessons span.nol{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;text-decoration:none;color:var(--ink);min-height:52px;line-height:1.55}
  ol.lessons a:hover{background:var(--bg)}
  ol.lessons .n{font-weight:800;color:var(--brand-d);font-size:17px;text-align:center}
  ol.lessons .mins{font-size:15px;color:var(--ink2);white-space:nowrap}
  ol.lessons span.nol{color:var(--ink2)}
  .muted{color:var(--ink2)}
  .msg{background:#fff;border-radius:var(--r);padding:28px;margin:20px 0}

  /* lesson */
  .lesson{max-width:820px}
  .lhead{padding:10px 0 30px}
  .lhead h1{font-size:clamp(30px,4.6vw,44px);line-height:1.3;margin:4px 0 18px;font-weight:800}
  .chips{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}
  .chip{background:#fff;border-radius:999px;padding:6px 14px;font-size:16px;font-weight:500;color:var(--ink2)}
  .chip b{color:var(--ink);font-weight:800}
  .lhead .cur{color:var(--ink2);margin:0;max-width:68ch}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
  .btn{display:inline-flex;align-items:center;gap:8px;border:0;font:inherit;font-size:17px;font-weight:700;border-radius:999px;padding:10px 22px;min-height:48px;cursor:pointer;text-decoration:none;transition:background .2s ease}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover{background:var(--brand-d)}
  .btn.ghost{background:#fff;color:var(--ink)}
  .btn.ghost:hover{background:var(--soft)}
  .btn svg{width:18px;height:18px}
  .card{background:var(--card);border-radius:var(--r);padding:30px 32px;margin:0 0 22px;box-shadow:0 1px 2px rgba(30,33,80,.04),0 8px 28px rgba(30,33,80,.05)}
  .card h2{font-size:24px;line-height:1.35;margin:0 0 16px;font-weight:800}
  .card h3{font-size:17px;margin:22px 0 8px;font-weight:700;color:var(--ink2)}
  .card ul{margin:0;padding-inline-start:22px}
  .card li{margin:0 0 8px;max-width:70ch}
  .card p{margin:0 0 10px;max-width:70ch}
  .stage-h{display:flex;align-items:center;gap:14px;margin:0 0 6px}
  .stage-n{width:44px;height:44px;border-radius:14px;background:var(--brand);color:#fff;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;flex:none}
  .stage-h h2{margin:0}
  .stage-h .smin{margin-inline-start:auto;font-size:16px;color:var(--ink2);white-space:nowrap}
  .act{padding:22px 0 0;margin-top:22px;border-top:1px solid var(--line)}
  .act:first-of-type{border-top:0;margin-top:8px;padding-top:12px}
  .act-h{display:flex;gap:14px;align-items:baseline;justify-content:space-between;flex-wrap:wrap;margin:0 0 8px}
  .act-h h3{margin:0;font-size:20px;color:var(--ink);font-weight:700}
  .min{background:var(--soft);color:var(--brand-d);font-weight:800;font-size:16px;border-radius:999px;padding:3px 14px;white-space:nowrap}
  .atype{font-size:15px;color:var(--ink2);margin:0 0 8px}
  .instr{margin:0;max-width:70ch}
  .instr .ans{background:var(--ans);color:var(--ink);border-radius:6px;padding:1px 5px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
  .diff{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .diff div{background:var(--bg);border-radius:16px;padding:18px}
  .diff h3{margin:0 0 6px;color:var(--ink);font-size:18px}
  .diff p{margin:0;font-size:17px}
  ol.qs{margin:0;padding:0;list-style:none;counter-reset:q}
  ol.qs li{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);max-width:none}
  ol.qs li:first-child{border-top:0}
  .lvl{flex:none;font-size:14px;font-weight:700;border-radius:999px;padding:3px 12px;background:var(--soft);color:var(--brand-d);margin-top:3px;white-space:nowrap}
  .exit{background:var(--brand);color:#fff}
  .exit h2{color:#fff}
  .pn{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:30px}
  .pn a{flex:1 1 260px;background:#fff;border-radius:18px;padding:16px 20px;text-decoration:none;color:var(--ink);min-height:44px}
  .pn a small{display:block;color:var(--ink2);font-size:15px}
  .pn a.next{text-align:left}

  footer{max-width:1080px;margin:0 auto;padding:0 24px 40px;color:var(--ink2);font-size:15px}

  @media (max-width:720px){
    header.top{padding:12px 16px;gap:6px}
    nav.main{margin-inline-start:0;width:100%;overflow:hidden}
    nav.main a{padding:8px 10px;font-size:15px}
    main{padding:0 16px 60px}
    .home{min-height:auto;padding:28px 0 40px}
    .ubtn{padding:18px;gap:12px}
    .unum{width:40px;height:40px;font-size:17px;border-radius:12px}
    .utitle{font-size:18px}
    .upanel{padding:0 14px 18px}
    ol.lessons a,ol.lessons span.nol{grid-template-columns:32px 1fr;padding:10px}
    ol.lessons .mins{display:none}
    .card{padding:22px 18px}
    .diff{grid-template-columns:1fr}
    .go{font-size:19px;padding:16px 26px;width:100%;justify-content:center}
    .pn a.next{text-align:right}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
  @media print{
    header.top,.actions,.crumbs,.pn,footer,.skip{display:none!important}
    body{background:#fff;font-size:12pt;line-height:1.55}
    main{padding:0;max-width:none}
    .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid-page;padding:14pt;margin-bottom:10pt}
    .exit{background:#fff;color:#000}.exit h2{color:#000}
    .stage-n{border:1px solid #000;color:#000;background:#fff}
    .view{animation:none}
  }
</style>
</head>
<body>
<a class="skip" href="#app">דילוג לתוכן</a>
<header class="top">
  <a class="logo" href="#/"><i aria-hidden="true"></i>מַעֲרָךְ</a>
  <nav class="main" aria-label="ניווט ראשי">
    <a href="#/" data-nav="home">ראשי</a>
    <a href="#/plan/sifrut-10" data-nav="plan" id="navPlan">תוכניות שנתיות</a>
    <a href="../index.html#library">המערכים שלי</a>
    <a href="../index.html#tools">כלים למורה</a>
  </nav>
</header>
<main id="app" tabindex="-1"></main>
<footer>מערכי שיעור לתנ״ך, ספרות ולשון · כיתות ז׳–י״ב · שנת הלימודים תשפ״ז</footer>

<script src="data.js"></script>
<script>
(function(){
  "use strict";
  var SUBJ = {tanach:"תנ״ך", sifrut:"ספרות", lashon:"לשון"};
  var SUBJ_ORDER = ["tanach","sifrut","lashon"];
  var GRADES = {7:"ז׳",8:"ח׳",9:"ט׳",10:"י׳",11:"י״א",12:"י״ב"};
  var TYPES = {read:"קריאה",discuss:"דיון",explain:"הסבר",group:"עבודה בקבוצות",write:"כתיבה",tps:"חשוב–התייעץ–שתף",media:"צפייה / האזנה",poll:"סקר",quiz:"בוחן",game:"משחק",exit:"סיכום",cloud:"ענן מילים"};
  var app = document.getElementById("app");
  var state = {subj:"sifrut", grade:10};
  var UNITS = window.UNITS || {};
  var loaded = {}, scripts = {};

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function parseKey(key){ var m = /^(tanach|sifrut|lashon)-(7|8|9|10|11|12)$/.exec(key||""); return m ? {subj:m[1], grade:+m[2]} : null; }
  function keyOf(s,g){ return s + "-" + g; }
  function stripNum(s){ return String(s||"").replace(/^\s*שיעור\s*\d+\s*[:：.\-–]\s*/, ""); }
  var chev = '<svg class="uchev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';

  function loadScript(src){
    if (scripts[src]) return scripts[src];
    scripts[src] = new Promise(function(res, rej){
      var s = document.createElement("script");
      s.src = src; s.async = true;
      s.onload = function(){ res(); };
      s.onerror = function(){ delete scripts[src]; rej(new Error(src)); };
      document.head.appendChild(s);
    });
    return scripts[src];
  }

  // Load full plan + all extra lessons for a key. Resolves to {plan, lessonsByUnit}
  function loadPlan(key){
    if (loaded[key]) return loaded[key];
    loaded[key] = loadScript("../data/" + key + ".js").then(function(){
      var plan = (window.YEAR_PLANS || []).filter(function(p){ return p.key === key; })[0];
      if (!plan) throw new Error("no plan");
      return loadScript("../data/more/index.js").catch(function(){}).then(function(){
        var nums = (window.MORE_INDEX && window.MORE_INDEX[key]) || [];
        return Promise.all(nums.map(function(n){ return loadScript("../data/more/" + key + "-u" + n + ".js").catch(function(){}); }));
      }).then(function(){
        var more = window.YEAR_MORE || {};
        var byUnit = plan.units.map(function(u, ui){
          var seen = {}, out = [];
          (u.lessons || []).concat(more[key + "#" + (ui+1)] || []).forEach(function(l){
            if (!l || seen[l.outlineIndex]) return; seen[l.outlineIndex] = 1; out.push(l);
          });
          out.sort(function(a,b){ return a.outlineIndex - b.outlineIndex; });
          return out;
        });
        return {plan: plan, byUnit: byUnit};
      });
    });
    loaded[key].catch(function(){ delete loaded[key]; });
    return loaded[key];
  }

  function setNav(which, key){
    document.getElementById("navPlan").setAttribute("href", "#/plan/" + (key || keyOf(state.subj, state.grade)));
    Array.prototype.forEach.call(document.querySelectorAll("nav.main a[data-nav]"), function(a){
      if (a.getAttribute("data-nav") === which) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current");
    });
  }
  function show(html, title){
    app.innerHTML = '<div class="view">' + html + '</div>';
    document.title = (title ? title + " · " : "") + "מַעֲרָךְ";
  }
  function errorBox(back){
    return '<div class="msg"><h2 style="margin:0 0 8px;font-weight:800">לא הצלחנו לטעון את התוכנית כרגע</h2><p style="margin:0 0 14px" class="muted">ייתכן שהקבצים לא זמינים. נסו לרענן את הדף בעוד רגע.</p>' + (back ? '<a class="btn ghost" href="' + back + '">חזרה</a>' : '') + '</div>';
  }

  /* ---------- HOME ---------- */
  function renderHome(){
    setNav("home");
    var subjOpts = SUBJ_ORDER.map(function(s){ return '<option value="' + s + '"' + (s===state.subj?" selected":"") + '>' + SUBJ[s] + '</option>'; }).join("");
    var gradeOpts = Object.keys(GRADES).map(function(g){ return '<option value="' + g + '"' + (+g===state.grade?" selected":"") + '>' + GRADES[g] + '</option>'; }).join("");
    show(
      '<section class="home">' +
        '<p class="hello">שלום, מה מלמדים השנה?</p>' +
        '<h1 class="sr">בחירת מקצוע וכיתה</h1><div class="sentence">אני מלמד/ת ' +
          '<label class="pill" id="pSubj"><span class="dot" aria-hidden="true"></span><span class="val"></span>' + chevSm() +
            '<select id="selSubj" aria-label="מקצוע">' + subjOpts + '</select></label> ' +
          'בכיתה ' +
          '<label class="pill" id="pGrade"><span class="val"></span>' + chevSm() +
            '<select id="selGrade" aria-label="כיתה">' + gradeOpts + '</select></label>' +
        '</div>' +
        '<p class="sub-note" id="stageNote"></p>' +
        '<a class="go" id="goBtn" href="#">הראו לי את השנה <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>' +
        '<div class="facts"><span><b>1,322</b>שיעורים מוכנים</span><span><b>18</b>תוכניות שנתיות</span><span><b>3</b>מקצועות · ז׳–י״ב</span></div>' +
      '</section>', "");
    var ss = document.getElementById("selSubj"), sg = document.getElementById("selGrade");
    function sync(){
      state.subj = ss.value; state.grade = +sg.value;
      var ps = document.getElementById("pSubj"), pg = document.getElementById("pGrade");
      ps.querySelector(".val").textContent = SUBJ[state.subj];
      ps.querySelector(".dot").style.background = "var(--" + state.subj + ")";
      pg.querySelector(".val").textContent = GRADES[state.grade];
      var k = keyOf(state.subj, state.grade), n = (UNITS[k] || []).length;
      document.getElementById("stageNote").textContent = (state.grade <= 9 ? "חטיבת ביניים" : "תיכון") + (n ? " · " + n + " יחידות לאורך השנה" : "");
      document.getElementById("goBtn").setAttribute("href", "#/plan/" + k);
      setNav("home", k);
    }
    ss.addEventListener("change", sync); sg.addEventListener("change", sync); sync();
  }
  function chevSm(){ return '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>'; }

  /* ---------- PLAN ---------- */
  var openUnits = {};
  function renderPlan(key){
    var pk = parseKey(key);
    if (!pk) { location.hash = "#/"; return; }
    state.subj = pk.subj; state.grade = pk.grade;
    setNav("plan", key);
    var units = UNITS[key] || [];
    var label = SUBJ[pk.subj] + " · כיתה " + GRADES[pk.grade];
    var grades = Object.keys(GRADES).map(function(g){
      var k = keyOf(pk.subj, g);
      return '<a href="#/plan/' + k + '"' + (k===key?' aria-current="page"':'') + ' aria-label="כיתה ' + GRADES[g] + '">' + GRADES[g] + '</a>';
    }).join("");
    var subs = SUBJ_ORDER.map(function(s){
      var k = keyOf(s, pk.grade);
      return '<a href="#/plan/' + k + '"' + (k===key?' aria-current="page"':'') + '><span class="sdot" style="width:9px;height:9px;margin-inline-end:8px;background:var(--' + s + ')" aria-hidden="true"></span>' + SUBJ[s] + '</a>';
    }).join("");
    if (!openUnits[key]) openUnits[key] = {0:true};
    show(
      '<nav class="crumbs" aria-label="מיקום"><a href="#/">ראשי</a><span aria-hidden="true">/</span><span>תוכנית שנתית</span></nav>' +
      '<section class="phead"><h1><span class="sdot" style="background:var(--' + pk.subj + ')" aria-hidden="true"></span>' + esc(label) + '</h1>' +
      '<p id="overview" class="muted">' + units.length + ' יחידות לאורך שנת הלימודים תשפ״ז. לחצו על יחידה כדי לראות את השיעורים שלה.</p>' +
      '<div class="switch" aria-label="מקצוע">' + subs + '</div><div class="switch" aria-label="כיתה" style="margin-top:8px">' + grades + '</div></section>' +
      '<div class="units">' + units.map(function(u, i){
        var open = !!openUnits[key][i];
        return '<section class="unit"><h2><button class="ubtn" type="button" aria-expanded="' + open + '" aria-controls="up' + i + '" data-u="' + i + '">' +
          '<span class="unum" aria-hidden="true">' + (i+1) + '</span><span><span class="utitle">' + esc(u.t) + '</span><span class="umeta">יחידה ' + (i+1) + ' · ' + esc(u.m) + '<span class="ucount" data-c="' + i + '"></span></span></span>' + chev +
          '</button></h2><div class="upanel" id="up' + i + '"' + (open?'':' hidden') + '><p class="muted" style="margin:0">טוען את השיעורים…</p></div></section>';
      }).join("") + '</div>' +
      (units.length ? '' : errorBox("#/")), label);

    Array.prototype.forEach.call(app.querySelectorAll(".ubtn"), function(b){
      b.addEventListener("click", function(){
        var i = +b.getAttribute("data-u"), open = b.getAttribute("aria-expanded") !== "true";
        b.setAttribute("aria-expanded", open);
        document.getElementById("up" + i).hidden = !open;
        openUnits[key][i] = open;
      });
    });

    loadPlan(key).then(function(d){
      if (location.hash.indexOf("#/plan/" + key) !== 0) return;
      if (d.plan.overview) document.getElementById("overview").textContent = d.plan.overview;
      d.plan.units.forEach(function(u, i){
        var panel = document.getElementById("up" + i); if (!panel) return;
        var ls = d.byUnit[i], have = {};
        ls.forEach(function(l){ have[l.outlineIndex] = l; });
        var c = app.querySelector('[data-c="' + i + '"]'); if (c && ls.length) c.textContent = " · " + ls.length + " שיעורים";
        var items = (u.outline && u.outline.length ? u.outline : ls.map(function(l){ return l.title; }));
        var html = (u.bigIdea ? '<p class="bigidea"><b>הרעיון הגדול: </b>' + esc(u.bigIdea) + '</p>' : '');
        html += '<ol class="lessons">' + items.map(function(t, j){
          var oi = u.outline && u.outline.length ? j + 1 : ls[j].outlineIndex;
          var l = have[oi];
          var title = l ? l.title : stripNum(t);
          if (l) return '<li><a href="#/lesson/' + key + '/' + (i+1) + '/' + oi + '"><span class="n">' + oi + '</span><span>' + esc(title) + '</span><span class="mins">' + esc(l.minutes || 45) + ' דק׳</span></a></li>';
          return '<li><span class="nol"><span class="n">' + oi + '</span><span>' + esc(title) + '</span></span></li>';
        }).join("") + '</ol>';
        panel.innerHTML = html;
      });
    }).catch(function(){
      Array.prototype.forEach.call(app.querySelectorAll(".upanel"), function(p){ p.innerHTML = '<p class="muted" style="margin:0">לא הצלחנו לטעון את השיעורים כרגע. נסו לרענן את הדף.</p>'; });
    });
  }

  /* ---------- LESSON ---------- */
  function fmtInstr(s){
    var e = esc(s);
    // gently highlight an answer in parentheses after a question mark
    e = e.replace(/\?(\s*)\(([^()]{2,400})\)/g, '?$1<span class="ans">($2)</span>');
    e = e.replace(/(התשובה הצפויה:)/g, '<b>$1</b>');
    return e.split(/\n+/).map(function(p){ return '<p class="instr">' + p + '</p>'; }).join("");
  }
  function renderLesson(key, un, oi){
    var pk = parseKey(key);
    if (!pk) { location.hash = "#/"; return; }
    state.subj = pk.subj; state.grade = pk.grade;
    setNav("plan", key);
    var back = "#/plan/" + key;
    show('<p class="muted" style="padding:40px 0">טוען את השיעור…</p>', "שיעור");
    loadPlan(key).then(function(d){
      var ui = un - 1, u = d.plan.units[ui];
      var ls = u ? d.byUnit[ui] : [];
      var l = ls.filter(function(x){ return x.outlineIndex === oi; })[0];
      if (!l) { show(errorBox(back).replace("לא הצלחנו לטעון את התוכנית כרגע", "השיעור הזה לא נמצא"), "שיעור"); return; }
      var idx = ls.indexOf(l), prev = ls[idx-1], next = ls[idx+1];
      var total = 0;
      var stages = (l.stages || []).map(function(st, si){
        var sm = 0;
        var acts = (st.activities || []).map(function(a){
          sm += +a.minutes || 0;
          return '<div class="act"><div class="act-h"><h3>' + esc(a.title) + '</h3>' + (a.minutes ? '<span class="min">' + esc(a.minutes) + ' דק׳</span>' : '') + '</div>' +
            (TYPES[a.type] ? '<p class="atype">' + esc(TYPES[a.type]) + '</p>' : '') + fmtInstr(a.instructions) + '</div>';
        }).join("");
        total += sm;
        return '<section class="card"><div class="stage-h"><span class="stage-n" aria-hidden="true">' + (si+1) + '</span><h2>שלב ' + (si+1) + ': ' + esc(st.name) + '</h2>' + (sm ? '<span class="smin">' + sm + ' דק׳</span>' : '') + '</div>' + acts + '</section>';
      }).join("");
      var diff = l.diff ? '<section class="card"><h2>הבחנה</h2><div class="diff">' +
        [["support","תמיכה"],["core","ליבה"],["enrich","העשרה"]].map(function(p){ return l.diff[p[0]] ? '<div><h3>' + p[1] + '</h3><p>' + esc(l.diff[p[0]]) + '</p></div>' : ''; }).join("") + '</div></section>' : '';
      var qs = (l.questions && l.questions.length) ? '<section class="card"><h2>שאלות לדיון</h2><ol class="qs">' + l.questions.map(function(q){
        return '<li>' + (q.level ? '<span class="lvl">' + esc(q.level) + '</span>' : '') + '<span>' + esc(q.q) + '</span></li>'; }).join("") + '</ol></section>' : '';
      var subjLabel = SUBJ[pk.subj] + " · כיתה " + GRADES[pk.grade];
      show(
        '<article class="lesson">' +
        '<nav class="crumbs" aria-label="מיקום"><a href="#/">ראשי</a><span aria-hidden="true">/</span><a href="' + back + '">' + esc(subjLabel) + '</a><span aria-hidden="true">/</span><span>יחידה ' + un + '</span></nav>' +
        '<header class="lhead"><div class="chips"><span class="chip"><span class="sdot" style="width:9px;height:9px;margin-inline-end:8px;background:var(--' + pk.subj + ')" aria-hidden="true"></span>' + esc(subjLabel) + '</span>' +
          '<span class="chip">שיעור <b>' + oi + '</b> ביחידה ' + un + '</span><span class="chip"><b>' + esc(l.minutes || total || 45) + '</b> דקות</span></div>' +
          '<h1>' + esc(l.title) + '</h1>' +
          (l.curriculum ? '<p class="cur"><b style="color:var(--ink)">תוכנית לימודים: </b>' + esc(l.curriculum) + '</p>' : '') +
          '<div class="actions"><button class="btn primary" type="button" id="printBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a1 1 0 0 1-1 1h-2M6 14h12v7H6z"/></svg>הדפסה</button>' +
          '<a class="btn ghost" href="' + back + '">חזרה לתוכנית</a></div></header>' +
        '<section class="card"><h2>מטרות השיעור</h2><ul>' + (l.goals || []).map(function(g){ return '<li>' + esc(g) + '</li>'; }).join("") + '</ul>' +
          (l.bloom && l.bloom.length ? '<h3>רמות חשיבה</h3><p>' + l.bloom.map(esc).join(" · ") + '</p>' : '') +
          (l.materials ? '<h3>חומרים</h3><p>' + esc(l.materials) + '</p>' : '') + '</section>' +
        stages + diff + qs +
        (l.exitTicket ? '<section class="card exit"><h2>כרטיס יציאה</h2><p>' + esc(l.exitTicket) + '</p></section>' : '') +
        (l.notes ? '<section class="card"><h2>הערות למורה</h2><p>' + esc(l.notes) + '</p></section>' : '') +
        '<nav class="pn" aria-label="שיעורים סמוכים">' +
          (prev ? '<a href="#/lesson/' + key + '/' + un + '/' + prev.outlineIndex + '"><small>→ השיעור הקודם</small>' + esc(prev.title) + '</a>' : '<span></span>') +
          (next ? '<a class="next" href="#/lesson/' + key + '/' + un + '/' + next.outlineIndex + '"><small>השיעור הבא ←</small>' + esc(next.title) + '</a>' : '') +
        '</nav></article>', l.title);
      document.getElementById("printBtn").addEventListener("click", function(){ window.print(); });
    }).catch(function(){ show(errorBox(back), "שגיאה"); });
  }

  /* ---------- ROUTER ---------- */
  function route(){
    var h = location.hash.replace(/^#\/?/, "").split("/");
    try {
      if (h[0] === "plan" && h[1]) renderPlan(h[1]);
      else if (h[0] === "lesson" && h[1]) renderLesson(h[1], parseInt(h[2],10) || 1, parseInt(h[3],10) || 1);
      else renderHome();
    } catch(e) { show(errorBox("#/"), ""); }
    window.scrollTo(0,0);
    if (h[0]) app.focus({preventScroll:true});
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
