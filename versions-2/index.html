<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>עוד חמש גרסאות · נעים וקריא · מַעֲרָךְ</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#eceef2;color:#1b2230;font-family:Heebo,system-ui,sans-serif;line-height:1.5}
header{max-width:1400px;margin:0 auto;padding:28px 20px 8px}
h1{margin:0 0 6px;font-size:28px}
header p{margin:0;color:#4b5568;max-width:760px}
.grid{max-width:1400px;margin:0 auto;padding:18px 20px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:20px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);display:flex;flex-direction:column;border:3px solid transparent}
.card.pick{border-color:#1e6b52}
.frame{position:relative;height:300px;overflow:hidden;background:#f6f6f6;border-bottom:1px solid #e5e7eb}
.frame iframe{position:absolute;top:0;right:0;width:1280px;height:960px;border:0;transform:scale(.3125);transform-origin:top right;pointer-events:none}
.info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.info h2{margin:0;font-size:19px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.n{background:#1b2230;color:#fff;border-radius:8px;padding:1px 9px;font-size:14px}
.badge{background:#1e6b52;color:#fff;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:700}
.info p{margin:0;color:#4b5568;font-size:14.5px}
.info a{margin-top:auto;align-self:flex-start;background:#1b2230;color:#fff;text-decoration:none;padding:10px 16px;border-radius:10px;font-weight:500;min-height:44px;display:inline-flex;align-items:center}
.info a:hover{background:#000}
@media (max-width:460px){.grid{grid-template-columns:1fr}.frame{height:240px}.frame iframe{transform:scale(.25)}}
</style>
</head>
<body>
<header>
  <h1>עוד חמש גרסאות: נעים וקריא</h1>
  <p>הסבב הזה מתמקד בעיצוב נעים וקריא: טקסט גדול, ריווח נוח, מעט צבעים ומעט רעש. כל גרסה עובדת עם התוכן האמיתי. לחצו על "פתחו בגודל מלא" כדי לנסות. <a href="../versions/">לחמש הגרסאות הקודמות (1–5)</a></p>
</header>
<div class="grid" id="g"></div>
<script>
const V=[
 {f:"v1.html",num:6,n:"ספר מורה",d:"דף קריאה שקט כמו ספר מעוצב: שוליים רחבים, אותיות סריפיות נעימות, תוכן עניינים לשנה. ירוק-אפרפר רגוע. החתימה: כפתורי A− / A+ וריווח שורות, שנשמרים לפעם הבאה."},
 {f:"v2.html",num:7,n:"משפט אחד",d:"דף בית כמעט ריק ומאוורר: ״אני מלמדת [ספרות] בכיתה [י׳]״, ולוחצים על המילים כדי לבחור. כרטיסים לבנים ומעוגלים על רקע תכלת-סגלגל."},
 {f:"v3.html",num:8,n:"תוכן עניינים",d:"תפריט צד קבוע עם עץ של יחידות ושיעורים, והתוכן לצידו. אפור בהיר וכחול מאובק. החתימה: סימון ״לימדתי ✓״ ליד כל שיעור, ומונה התקדמות לכל יחידה."},
 {f:"v4.html",num:9,n:"גדול וברור",d:"הכול גדול וברור: אריחי מקצוע ענקיים, טקסט בגודל 20, ניגודיות גבוהה וצהוב רך להדגשה. החתימה: ״מצב הוראה״, שלב אחד בכל מסך באותיות גדולות להקרנה בכיתה."},
 {f:"v5.html",num:10,n:"עונות",d:"פלטה טבעית רכה: מנטה, אקליפטוס ואפרסק, עם איורי עלים עדינים. השנה מחולקת לסתיו, חורף, אביב וקיץ. החתימה: פס עונתי שמראה שעכשיו סתיו, חשוון, ומה מלמדים בעונה הזו."}
];
const PICK=window.PICK||"";
document.getElementById("g").innerHTML=V.map((v,i)=>'<div class="card'+(PICK===v.f?' pick':'')+'"><div class="frame"><iframe src="'+v.f+'" loading="lazy" title="'+v.n+'" tabindex="-1"></iframe></div><div class="info"><h2><span class="n">'+v.num+'</span>'+v.n+(PICK===v.f?' <span class="badge">ההמלצה שלי</span>':'')+'</h2><p>'+v.d+'</p><a href="'+v.f+'" target="_blank" rel="noopener">פתחו בגודל מלא ←</a></div></div>').join("");
</script>
</body>
</html>
