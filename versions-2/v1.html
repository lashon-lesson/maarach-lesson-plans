<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מַעֲרָךְ · ספר מורה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=David+Libre:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#eef2ee;
  --sheet:#ffffff;
  --ink:#1f3a34;
  --ink-2:#44605a;      /* secondary text, AA on white and on page */
  --accent:#2c6e69;     /* muted teal */
  --accent-soft:#e3efed;
  --rule:#cfd9d4;
  --serif:"David Libre", "David", "Times New Roman", system-ui, serif;
  --sans:"Assistant", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --read-size:19px;
  --read-lh:1.8;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--page);color:var(--ink);
  font-family:var(--sans);font-size:18px;line-height:1.7;
}
a{color:var(--accent);text-underline-offset:3px;text-decoration-thickness:1px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
button{font:inherit;color:inherit}

/* ---------- top navigation ---------- */
.top{
  max-width:1040px;margin:0 auto;padding:22px 28px 0;
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
.brand{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--ink);text-decoration:none;letter-spacing:.5px}
.top nav{display:flex;gap:4px 22px;flex-wrap:wrap}
.top nav a{
  color:var(--ink-2);text-decoration:none;font-size:16px;font-weight:600;
  min-height:44px;display:inline-flex;align-items:center;
}
.top nav a:hover,.top nav a[aria-current="page"]{color:var(--ink);text-decoration:underline;text-underline-offset:6px}

main{max-width:1040px;margin:0 auto;padding:0 28px 96px}
.view{animation:fade .35s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---------- home ---------- */
.home{text-align:center;padding:12vh 0 40px}
.home h1{
  font-family:var(--serif);font-weight:500;font-size:clamp(40px,7vw,64px);
  margin:0 0 18px;line-height:1.15;letter-spacing:.5px
}
.home .lede{font-size:19px;color:var(--ink-2);max-width:34em;margin:0 auto 10px}
.home .facts{font-size:16px;color:var(--ink-2);margin:0 auto 64px}
.home .facts strong{color:var(--ink);font-weight:700}
.pick{margin:0 auto 34px}
.pick .label{display:block;font-size:15px;font-weight:600;color:var(--ink-2);letter-spacing:.5px;margin-bottom:8px}
.pick .row{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 34px}
.pick .row a{
  font-family:var(--serif);font-size:clamp(26px,4vw,34px);color:var(--ink);text-decoration:none;
  min-height:48px;display:inline-flex;align-items:center;padding:0 4px;
  border-bottom:2px solid transparent;
}
.pick .row a:hover{border-bottom-color:var(--rule)}
.pick .row a[aria-current="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.pick .stage{display:block;font-size:14px;color:var(--ink-2);margin-top:6px}
.go{
  display:inline-flex;align-items:center;gap:10px;margin-top:22px;
  font-size:19px;font-weight:600;color:var(--accent);text-decoration:none;min-height:48px;
  border-bottom:1px solid var(--accent);
}

/* ---------- sheet (year + lesson) ---------- */
.sheet{
  background:var(--sheet);margin:36px auto 0;max-width:820px;
  padding:72px clamp(22px,8vw,96px) 80px;border-radius:4px;
  box-shadow:0 1px 2px rgba(31,58,52,.06),0 10px 30px rgba(31,58,52,.05);
}
.crumb{font-size:16px;margin:28px auto 0;max-width:820px}
.crumb a{display:inline-flex;align-items:center;min-height:44px;font-weight:600;text-decoration:none}
.crumb a:hover{text-decoration:underline}

/* year / table of contents */
.toc-head{text-align:center;margin-bottom:56px}
.toc-head .kicker{font-size:15px;font-weight:600;color:var(--ink-2);letter-spacing:1px}
.toc-head h1{font-family:var(--serif);font-weight:500;font-size:clamp(34px,5vw,46px);margin:6px 0 14px;line-height:1.2}
.toc-head p{font-family:var(--serif);font-size:18px;color:var(--ink-2);max-width:36em;margin:0 auto;line-height:1.75}
.toc-head .switch{font-family:var(--sans);font-size:15px;margin-top:20px;color:var(--ink-2)}
.toc-head .switch a{display:inline-flex;min-height:44px;align-items:center;padding:0 6px}

.chapter{margin:0 0 52px}
.chapter-head{
  width:100%;background:none;border:0;padding:0;margin:0;text-align:right;cursor:pointer;
  display:block;color:var(--ink);
}
.chapter-head .num{display:block;font-size:14px;font-weight:600;color:var(--accent);letter-spacing:1px}
.chapter-head .title{display:block;font-family:var(--serif);font-size:clamp(22px,3vw,27px);font-weight:500;line-height:1.4;margin:4px 0 4px}
.chapter-head .months{display:block;font-size:15px;color:var(--ink-2)}
.chapter-head .toggle{font-size:15px;color:var(--accent);font-weight:600}
.chapter-head:hover .title{text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:6px}
.entries{list-style:none;margin:20px 0 0;padding:0}
.entries li{margin:0}
.entries a{
  display:flex;align-items:baseline;gap:12px;color:var(--ink);text-decoration:none;
  padding:8px 0;min-height:44px;font-family:var(--serif);font-size:18px;line-height:1.55;
}
.entries .n{flex:0 0 2.2em;color:var(--ink-2);font-family:var(--sans);font-size:15px;font-variant-numeric:tabular-nums}
.entries .t{flex:0 1 auto}
.entries .dots{flex:1 1 2em;border-bottom:1px dotted #8da39c;transform:translateY(-5px);min-width:1.5em}
.entries .m{flex:0 0 auto;font-family:var(--sans);font-size:15px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.entries a:hover .t{color:var(--accent);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.note{font-size:16px;color:var(--ink-2);font-style:normal}
.err{
  background:var(--accent-soft);border-radius:4px;padding:18px 22px;font-size:17px;color:var(--ink);margin:24px 0
}

/* ---------- lesson reading page ---------- */
.comfort{
  display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-wrap:wrap;
  max-width:820px;margin:0 auto;font-size:15px;color:var(--ink-2)
}
.comfort .grp{display:inline-flex;align-items:center;gap:2px;background:var(--sheet);border-radius:999px;padding:3px;box-shadow:0 0 0 1px var(--rule)}
.comfort button{
  min-width:44px;min-height:44px;border:0;background:none;border-radius:999px;cursor:pointer;
  font-weight:700;font-size:16px;color:var(--ink);padding:0 12px;
}
.comfort button:hover{background:var(--accent-soft)}
.comfort button[aria-pressed="true"]{background:var(--accent);color:#fff}
.comfort .sz{font-variant-numeric:tabular-nums;min-width:3.2em;text-align:center}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-inline-start:auto}
.actions a,.actions button{
  min-height:44px;display:inline-flex;align-items:center;padding:0 16px;border-radius:999px;
  font-weight:600;font-size:16px;text-decoration:none;cursor:pointer;
  background:var(--sheet);color:var(--ink);border:0;box-shadow:0 0 0 1px var(--rule);
}
.actions a:hover,.actions button:hover{box-shadow:0 0 0 1px var(--accent);color:var(--accent)}
.lesson-bar{max-width:820px;margin:28px auto 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}

article.lesson{font-family:var(--serif);font-size:var(--read-size);line-height:var(--read-lh)}
article.lesson .col{max-width:66ch;margin:0 auto}
.lesson-head{text-align:center;margin-bottom:48px}
.lesson-head .kicker{font-family:var(--sans);font-size:15px;font-weight:600;color:var(--ink-2);letter-spacing:.5px;line-height:1.6}
.lesson-head h1{font-weight:500;font-size:clamp(30px,1.6em,42px);line-height:1.3;margin:10px 0 16px}
.lesson-head .meta{font-family:var(--sans);font-size:16px;color:var(--ink-2)}
.lesson-head .meta b{color:var(--ink)}
.lesson-head .curr{font-size:.92em;color:var(--ink-2);margin:18px auto 0;max-width:40em;line-height:1.7}
.ornament{display:block;text-align:center;color:var(--accent);letter-spacing:12px;margin:44px 0;font-size:16px;line-height:1}

article.lesson h2{
  font-family:var(--serif);font-weight:700;font-size:1.22em;line-height:1.4;margin:2.4em 0 .7em;color:var(--ink)
}
article.lesson h2 .sn{font-family:var(--sans);font-weight:700;color:var(--accent);font-size:.68em;display:block;letter-spacing:.5px;margin-bottom:2px}
article.lesson p{margin:0 0 1em}
article.lesson ol.goals{padding-inline-start:1.3em;margin:0 0 1em}
article.lesson ol.goals li{margin-bottom:.55em;padding-inline-start:.2em}
.bloom{font-family:var(--sans);font-size:15px;color:var(--ink-2);margin-top:.4em}

.act{margin:0 0 1.9em}
.act h3{
  font-family:var(--serif);font-weight:700;font-size:1.05em;line-height:1.45;margin:0 0 .35em;
  display:flex;gap:14px;align-items:baseline;flex-wrap:wrap
}
.act .min{
  font-family:var(--sans);font-size:15px;font-weight:700;color:var(--accent);
  background:var(--accent-soft);border-radius:999px;padding:1px 11px;white-space:nowrap;line-height:1.7
}
.act .instr p{margin:0 0 .8em}
.ans{background:var(--accent-soft);border-radius:3px;padding:0 .2em;box-decoration-break:clone;-webkit-box-decoration-break:clone}

.diff dt{font-family:var(--sans);font-weight:700;font-size:15px;color:var(--accent);letter-spacing:.5px;margin-top:1.1em}
.diff dd{margin:0}
ol.qs{padding-inline-start:1.3em;margin:0}
ol.qs li{margin-bottom:.9em;padding-inline-start:.2em}
.qs .lvl{font-family:var(--sans);font-size:14px;font-weight:600;color:var(--ink-2);display:block;line-height:1.5}
.exit{border-inline-start:3px solid var(--accent);padding-inline-start:1em}

.pager{
  display:flex;justify-content:space-between;gap:20px;margin-top:64px;padding-top:28px;
  border-top:1px solid var(--rule);font-family:var(--sans);font-size:16px
}
.pager a{display:flex;flex-direction:column;min-height:44px;text-decoration:none;max-width:48%}
.pager a small{color:var(--ink-2);font-size:14px}
.pager a span{font-family:var(--serif);font-size:18px;color:var(--ink);line-height:1.45}
.pager a:hover span{color:var(--accent);text-decoration:underline}
.pager .next{margin-inline-start:auto;text-align:left}

footer{max-width:820px;margin:48px auto 0;text-align:center;font-size:15px;color:var(--ink-2)}

/* ---------- small screens ---------- */
@media (max-width:640px){
  .top{padding:14px 18px 0}
  .top nav{gap:0 16px}
  .top nav a{font-size:15px}
  main{padding:0 12px 64px}
  .home{padding:8vh 6px 24px}
  .sheet{padding:44px 20px 52px;margin-top:20px}
  .entries a{font-size:17px;gap:8px}
  .entries .n{flex-basis:1.8em}
  .comfort{justify-content:flex-start}
  .actions{margin-inline-start:0}
}

/* ---------- print ---------- */
@media print{
  @page{margin:16mm}
  body{background:#fff}
  .top,.crumb,.lesson-bar,.comfort,.actions,.pager,footer,.toc-head .switch{display:none!important}
  main{padding:0;max-width:none}
  .sheet{box-shadow:none;margin:0;padding:0;max-width:none}
  article.lesson{font-size:12.5pt;line-height:1.6}
  .act,.diff,ol.qs li{break-inside:avoid}
  .ans,.act .min{background:none}
  a{color:var(--ink);text-decoration:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#/">מַעֲרָךְ</a>
  <nav aria-label="ניווט ראשי">
    <a href="#/" id="nav-home">ראשי</a>
    <a href="#/plan/sifrut-10" id="nav-plans">תוכניות שנתיות</a>
    <a href="../index.html#library">המערכים שלי</a>
    <a href="../index.html#tools">כלים למורה</a>
  </nav>
</header>
<main id="app" aria-live="polite"></main>

<script src="data.js"></script>
<script>
(function(){
"use strict";

var SUBJECTS = [
  {slug:"tanach", name:"תנ״ך"},
  {slug:"sifrut", name:"ספרות"},
  {slug:"lashon", name:"לשון"}
];
var GRADES = {7:"ז׳",8:"ח׳",9:"ט׳",10:"י׳",11:"י״א",12:"י״ב"};
var DEFAULT_KEY = "sifrut-10";
var UNITS = window.UNITS || {};
var app = document.getElementById("app");
var lastKey = DEFAULT_KEY;

/* ---------- helpers ---------- */
function esc(v){
  return String(v == null ? "" : v)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function parseKey(key){
  var m = /^(tanach|sifrut|lashon)-(7|8|9|10|11|12)$/.exec(key || "");
  if(!m) return null;
  var subj = SUBJECTS.filter(function(s){return s.slug===m[1];})[0];
  return {slug:m[1], grade:+m[2], subject:subj.name, gradeName:GRADES[m[2]]};
}
function stripLessonPrefix(s){
  return String(s||"").replace(/^\s*שיעור(ים)?\s*[\d–\-–]+\s*[:.]\s*/,"");
}
function store(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function load(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

/* script loader (works from file://) */
var scriptCache = {};
function loadScript(src){
  if(scriptCache[src]) return scriptCache[src];
  scriptCache[src] = new Promise(function(resolve,reject){
    var s = document.createElement("script");
    s.src = src; s.async = true;
    s.onload = function(){ resolve(); };
    s.onerror = function(){ delete scriptCache[src]; s.remove(); reject(new Error("load "+src)); };
    document.head.appendChild(s);
  });
  return scriptCache[src];
}
function getPlan(key){
  function find(){ return (window.YEAR_PLANS||[]).filter(function(p){return p && p.key===key;})[0]; }
  var p = find();
  if(p) return Promise.resolve(p);
  return loadScript("../data/"+key+".js").then(function(){
    var q = find(); if(!q) throw new Error("no plan"); return q;
  });
}
function getMoreIndex(){
  if(window.MORE_INDEX) return Promise.resolve(window.MORE_INDEX);
  return loadScript("../data/more/index.js").then(function(){ return window.MORE_INDEX || {}; })
    .catch(function(){ return {}; });
}
/* all lessons of unit ui (0-based), merged + sorted */
function getUnitLessons(key, plan, ui){
  var unit = plan.units[ui] || {};
  var base = Array.isArray(unit.lessons) ? unit.lessons : [];
  return getMoreIndex().then(function(idx){
    var list = idx[key] || [];
    var n = ui+1;
    if(list.indexOf(n) < 0) return [];
    return loadScript("../data/more/"+key+"-u"+n+".js").then(function(){
      return (window.YEAR_MORE||{})[key+"#"+n] || [];
    }).catch(function(){ return []; });
  }).then(function(more){
    var seen = {}, out = [];
    base.concat(more).forEach(function(l){
      if(!l || l.outlineIndex == null || seen[l.outlineIndex]) return;
      seen[l.outlineIndex] = true; out.push(l);
    });
    out.sort(function(a,b){ return a.outlineIndex - b.outlineIndex; });
    return out;
  });
}
/* soft highlight of expected answers, applied on already-escaped text */
function markAnswers(html){
  html = html.replace(/\(((?:התשובה|תשובה|תשובות|תשובה אפשרית|צפוי|הצפוי)[^()]{0,400})\)/g,
    '(<span class="ans">$1</span>)');
  html = html.replace(/((?:התשובה|תשובה) (?:הצפויה|הרצויה|אפשרית|המצופה)\s*:[^.<>]{1,300}\.)/g,
    '<span class="ans">$1</span>');
  return html;
}
function paras(text, highlight){
  var parts = String(text||"").split(/\n+/).filter(function(s){return s.trim();});
  if(!parts.length) return "";
  return parts.map(function(p){
    var h = esc(p.trim());
    return "<p>"+(highlight ? markAnswers(h) : h)+"</p>";
  }).join("");
}
function errorBox(msg){
  return '<div class="err" role="alert">'+esc(msg)+' <a href="#/">חזרה לעמוד הראשי</a></div>';
}
function setNav(which){
  document.getElementById("nav-home").setAttribute("aria-current", which==="home"?"page":"false");
  var np = document.getElementById("nav-plans");
  np.setAttribute("aria-current", which==="plan"?"page":"false");
  np.href = "#/plan/"+lastKey;
}

/* ---------- home ---------- */
var homeSubject = (parseKey(load("maarach-v1-key")||"")||{}).slug || "sifrut";
var homeGrade = (parseKey(load("maarach-v1-key")||"")||{}).grade || 10;

function renderHome(){
  setNav("home");
  document.title = "מַעֲרָךְ · מערכי שיעור לתנ״ך, ספרות ולשון";
  var subjRow = SUBJECTS.map(function(s){
    return '<a href="#/" data-subj="'+s.slug+'" aria-current="'+(s.slug===homeSubject)+'">'+esc(s.name)+'</a>';
  }).join("");
  function gradeRow(from,to){
    var h = "";
    for(var g=from; g<=to; g++){
      var k = homeSubject+"-"+g;
      h += '<a href="#/plan/'+k+'" aria-current="'+(g===homeGrade)+'">'+esc(GRADES[g])+'</a>';
    }
    return h;
  }
  var cur = parseKey(homeSubject+"-"+homeGrade);
  app.innerHTML =
    '<section class="view home">'+
      '<h1>מערכי שיעור, מוכנים להוראה</h1>'+
      '<p class="lede">תוכנית שנתית לכל מקצוע ולכל כיתה, ובכל שיעור מערך מלא: מטרות, שלבים, שאלות וכרטיס יציאה.</p>'+
      '<p class="facts"><strong>1,322</strong> שיעורים · <strong>18</strong> תוכניות שנתיות · תשפ״ז</p>'+
      '<div class="pick" role="group" aria-label="מקצוע">'+
        '<span class="label">מקצוע</span><div class="row" id="subj-row">'+subjRow+'</div>'+
      '</div>'+
      '<div class="pick" role="group" aria-label="כיתה">'+
        '<span class="label">כיתה</span>'+
        '<div class="row">'+gradeRow(7,9)+'</div><span class="stage">חטיבת ביניים</span>'+
        '<div class="row" style="margin-top:14px">'+gradeRow(10,12)+'</div><span class="stage">תיכון</span>'+
      '</div>'+
      '<a class="go" href="#/plan/'+cur.slug+'-'+cur.grade+'">לתוכנית השנתית: '+esc(cur.subject)+' '+esc(cur.gradeName)+' ←</a>'+
    '</section>';
  Array.prototype.forEach.call(app.querySelectorAll("[data-subj]"), function(a){
    a.addEventListener("click", function(e){
      e.preventDefault();
      homeSubject = a.getAttribute("data-subj");
      renderHome();
      var f = app.querySelector('[data-subj="'+homeSubject+'"]'); if(f) f.focus();
    });
  });
}

/* ---------- year / table of contents ---------- */
function renderPlan(key){
  var info = parseKey(key);
  if(!info){ app.innerHTML = '<div class="sheet">'+errorBox("לא מצאנו את התוכנית הזו.")+'</div>'; return; }
  lastKey = key; homeSubject = info.slug; homeGrade = info.grade; store("maarach-v1-key", key);
  setNav("plan");
  document.title = "תוכנית שנתית · "+info.subject+" "+info.gradeName+" · מַעֲרָךְ";
  var quick = UNITS[key] || [];
  var others = [];
  for(var g=7; g<=12; g++){
    if(g===info.grade) continue;
    others.push('<a href="#/plan/'+info.slug+'-'+g+'">'+esc(GRADES[g])+'</a>');
  }
  app.innerHTML =
    '<div class="crumb view"><a href="#/">→ בחירת מקצוע וכיתה</a></div>'+
    '<section class="sheet view">'+
      '<header class="toc-head">'+
        '<div class="kicker">תוכנית שנתית · תשפ״ז</div>'+
        '<h1>'+esc(info.subject)+' · כיתה '+esc(info.gradeName)+'</h1>'+
        '<p id="overview"></p>'+
        '<div class="switch">כיתות אחרות: '+others.join(" · ")+'</div>'+
      '</header>'+
      '<div id="chapters">'+ quick.map(function(u,i){ return chapterHTML(key,i,u.t,u.m,null); }).join("") +'</div>'+
      '<div id="plan-msg"></div>'+
    '</section>';
  bindChapters(key);

  getPlan(key).then(function(plan){
    if(lastKey!==key || !document.getElementById("chapters")) return;
    var ov = document.getElementById("overview");
    if(ov && plan.overview){
      var o = String(plan.overview); var cut = o.split(/(?<=\.)\s/)[0];
      ov.textContent = cut.length < o.length && cut.length > 60 ? cut : o;
    }
    var openSet = openChapters(key);
    document.getElementById("chapters").innerHTML = (plan.units||[]).map(function(u,i){
      return chapterHTML(key,i,u.title,u.months,u.outline||[], openSet[i]);
    }).join("");
    bindChapters(key);
    (plan.units||[]).forEach(function(u,i){ if(openSet[i]) fillMinutes(key,plan,i); });
  }).catch(function(){
    var m = document.getElementById("plan-msg");
    if(m) m.innerHTML = errorBox("לא הצלחנו לטעון את רשימת השיעורים כרגע. אפשר לרענן את הדף ולנסות שוב.");
  });
}
function openChapters(key){
  var raw = load("maarach-v1-open-"+key);
  var set = {};
  if(raw===null){ set[0]=true; return set; }
  raw.split(",").forEach(function(x){ if(x!=="") set[+x]=true; });
  return set;
}
function saveOpen(key){
  var ids = [];
  Array.prototype.forEach.call(app.querySelectorAll(".chapter"), function(c){
    if(c.querySelector(".chapter-head").getAttribute("aria-expanded")==="true") ids.push(c.getAttribute("data-ui"));
  });
  store("maarach-v1-open-"+key, ids.join(","));
}
function chapterHTML(key, ui, title, months, outline, open){
  var entries = "";
  if(outline){
    entries = '<ol class="entries" id="ent-'+ui+'"'+(open?"":" hidden")+'>'+ outline.map(function(o,oi){
      var n = oi+1;
      return '<li><a href="#/lesson/'+key+'/'+(ui+1)+'/'+n+'">'+
        '<span class="n">'+n+'.</span><span class="t">'+esc(stripLessonPrefix(o))+'</span>'+
        '<span class="dots" aria-hidden="true"></span><span class="m" data-oi="'+n+'">&nbsp;</span></a></li>';
    }).join("") +'</ol>';
  }
  var count = outline ? outline.length+" שיעורים" : "";
  return '<section class="chapter" data-ui="'+ui+'">'+
    '<button class="chapter-head" type="button" aria-expanded="'+(outline&&open?"true":"false")+'" aria-controls="ent-'+ui+'"'+(outline?"":" disabled")+'>'+
      '<span class="num">פרק '+(ui+1)+'</span>'+
      '<span class="title">'+esc(title)+'</span>'+
      '<span class="months">'+esc(months||"")+(count?' · '+count:'')+
        (outline?' · <span class="toggle">'+(open?"הסתרת השיעורים":"הצגת השיעורים")+'</span>':'')+'</span>'+
    '</button>'+ entries +
  '</section>';
}
var cachedPlans = {};
function bindChapters(key){
  Array.prototype.forEach.call(app.querySelectorAll(".chapter-head:not([disabled])"), function(b){
    b.addEventListener("click", function(){
      var sec = b.parentNode, ui = +sec.getAttribute("data-ui");
      var list = document.getElementById("ent-"+ui);
      var open = b.getAttribute("aria-expanded")!=="true";
      b.setAttribute("aria-expanded", String(open));
      if(list) list.hidden = !open;
      var t = b.querySelector(".toggle"); if(t) t.textContent = open?"הסתרת השיעורים":"הצגת השיעורים";
      saveOpen(key);
      if(open) getPlan(key).then(function(p){ fillMinutes(key,p,ui); }).catch(function(){});
    });
  });
}
function fillMinutes(key, plan, ui){
  getUnitLessons(key, plan, ui).then(function(lessons){
    var list = document.getElementById("ent-"+ui); if(!list) return;
    var byOi = {}; lessons.forEach(function(l){ byOi[l.outlineIndex]=l; });
    Array.prototype.forEach.call(list.querySelectorAll(".m"), function(m){
      var l = byOi[m.getAttribute("data-oi")];
      m.textContent = l && l.minutes ? l.minutes+" דק׳" : "";
    });
  });
}

/* ---------- lesson ---------- */
var comfort = (function(){
  var size = parseInt(load("maarach-v1-size"),10);
  if(!(size>=16 && size<=26)) size = 19;
  return {size:size, airy: load("maarach-v1-airy")==="1"};
})();
function applyComfort(){
  var art = document.querySelector("article.lesson"); if(!art) return;
  art.style.setProperty("--read-size", comfort.size+"px");
  art.style.setProperty("--read-lh", comfort.airy ? "2.1" : "1.8");
  var s = document.getElementById("sz"); if(s) s.textContent = Math.round(comfort.size/19*100)+"%";
  var a = document.getElementById("airy"); if(a) a.setAttribute("aria-pressed", String(comfort.airy));
  var dn = document.getElementById("a-dn"), up = document.getElementById("a-up");
  if(dn) dn.disabled = comfort.size<=16; if(up) up.disabled = comfort.size>=26;
}

function renderLesson(key, un, oi){
  var info = parseKey(key);
  if(!info || !(un>=1) || !(oi>=1)){ app.innerHTML = '<div class="sheet">'+errorBox("לא מצאנו את השיעור הזה.")+'</div>'; return; }
  lastKey = key; store("maarach-v1-key", key);
  setNav("plan");
  app.innerHTML =
    '<div class="lesson-bar view">'+
      '<div class="actions" style="margin-inline-start:0">'+
        '<a href="#/plan/'+key+'">→ חזרה לתוכנית</a>'+
        '<button type="button" id="print">הדפסה</button>'+
      '</div>'+
      '<div class="comfort" role="group" aria-label="נוחות קריאה" style="margin-inline-start:auto">'+
        '<span class="grp">'+
          '<button type="button" id="a-dn" aria-label="הקטנת הטקסט">A−</button>'+
          '<span class="sz" id="sz" aria-live="polite"></span>'+
          '<button type="button" id="a-up" aria-label="הגדלת הטקסט">A+</button>'+
        '</span>'+
        '<span class="grp"><button type="button" id="airy" aria-pressed="false">רווח שורות</button></span>'+
      '</div>'+
    '</div>'+
    '<section class="sheet view"><article class="lesson"><div class="col" id="lesson-body">'+
      '<p class="note" style="text-align:center">טוען את השיעור…</p>'+
    '</div></article></section>';
  document.getElementById("print").addEventListener("click", function(){ window.print(); });
  document.getElementById("a-dn").addEventListener("click", function(){ comfort.size=Math.max(16,comfort.size-1); store("maarach-v1-size",comfort.size); applyComfort(); });
  document.getElementById("a-up").addEventListener("click", function(){ comfort.size=Math.min(26,comfort.size+1); store("maarach-v1-size",comfort.size); applyComfort(); });
  document.getElementById("airy").addEventListener("click", function(){ comfort.airy=!comfort.airy; store("maarach-v1-airy",comfort.airy?"1":"0"); applyComfort(); });
  applyComfort();

  var body = document.getElementById("lesson-body");
  getPlan(key).then(function(plan){
    var unit = (plan.units||[])[un-1];
    if(!unit) throw new Error("no unit");
    return getUnitLessons(key, plan, un-1).then(function(lessons){ return {plan:plan, unit:unit, lessons:lessons}; });
  }).then(function(d){
    if(!document.getElementById("lesson-body")) return;
    var L = d.lessons.filter(function(l){ return +l.outlineIndex===oi; })[0];
    var outline = d.unit.outline || [];
    if(!L){
      body.innerHTML = errorBox("המערך לשיעור הזה עדיין לא זמין.")+
        '<p><a href="#/plan/'+key+'">חזרה לתוכנית השנתית</a></p>';
      return;
    }
    document.title = L.title+" · "+info.subject+" "+info.gradeName+" · מַעֲרָךְ";
    body.innerHTML = lessonHTML(key, info, un, oi, d.unit, L, outline);
    window.scrollTo(0,0);
  }).catch(function(){
    if(document.getElementById("lesson-body"))
      body.innerHTML = errorBox("לא הצלחנו לטעון את השיעור כרגע. אפשר לרענן את הדף ולנסות שוב.");
  });
}

function lessonHTML(key, info, un, oi, unit, L, outline){
  var h = "";
  h += '<header class="lesson-head">'+
    '<div class="kicker">'+esc(info.subject)+' · כיתה '+esc(info.gradeName)+' · פרק '+un+': '+esc(unit.title||"")+'</div>'+
    '<h1>'+esc(L.title)+'</h1>'+
    '<div class="meta">שיעור '+oi+(outline.length?' מתוך '+outline.length:'')+(L.minutes?' · <b>'+esc(L.minutes)+' דקות</b>':'')+'</div>'+
    (L.curriculum ? '<p class="curr"><span style="font-family:var(--sans);font-weight:600;font-size:15px">תוכנית הלימודים: </span>'+esc(L.curriculum)+'</p>' : '')+
  '</header>';

  if(L.goals && L.goals.length){
    h += '<h2>מטרות השיעור</h2><ol class="goals">'+L.goals.map(function(g){return '<li>'+esc(g)+'</li>';}).join("")+'</ol>';
    if(L.bloom && L.bloom.length) h += '<div class="bloom">רמות חשיבה: '+L.bloom.map(esc).join(" · ")+'</div>';
  }
  if(L.materials){ h += '<h2>חומרים</h2>'+paras(L.materials); }

  h += '<span class="ornament" aria-hidden="true">· · ·</span>';

  (L.stages||[]).forEach(function(st, si){
    var stMin = 0; (st.activities||[]).forEach(function(a){ stMin += (+a.minutes||0); });
    h += '<h2><span class="sn">שלב '+(si+1)+(stMin?' · '+stMin+' דק׳':'')+'</span>'+esc(st.name||"")+'</h2>';
    (st.activities||[]).forEach(function(a){
      h += '<div class="act"><h3><span>'+esc(a.title||"")+'</span>'+
        (a.minutes?'<span class="min">'+esc(a.minutes)+' דק׳</span>':'')+'</h3>'+
        '<div class="instr">'+paras(a.instructions, true)+'</div></div>';
    });
  });

  if(L.diff && (L.diff.support||L.diff.core||L.diff.enrich)){
    h += '<span class="ornament" aria-hidden="true">· · ·</span>';
    h += '<h2>הבחנה</h2><dl class="diff">'+
      (L.diff.support?'<dt>תמיכה</dt><dd>'+paras(L.diff.support)+'</dd>':'')+
      (L.diff.core?'<dt>ליבה</dt><dd>'+paras(L.diff.core)+'</dd>':'')+
      (L.diff.enrich?'<dt>העשרה</dt><dd>'+paras(L.diff.enrich)+'</dd>':'')+
    '</dl>';
  }
  if(L.questions && L.questions.length){
    h += '<h2>שאלות</h2><ol class="qs">'+L.questions.map(function(q){
      return '<li>'+(q.level?'<span class="lvl">'+esc(q.level)+'</span>':'')+markAnswers(esc(q.q))+'</li>';
    }).join("")+'</ol>';
  }
  if(L.exitTicket){ h += '<h2>כרטיס יציאה</h2><div class="exit">'+paras(L.exitTicket, true)+'</div>'; }
  if(L.notes){ h += '<h2>הערות למורה</h2>'+paras(L.notes, true); }

  var prev = oi>1 ? '<a class="prev" href="#/lesson/'+key+'/'+un+'/'+(oi-1)+'"><small>→ השיעור הקודם</small><span>'+esc(stripLessonPrefix(outline[oi-2]||""))+'</span></a>' : '';
  var next = oi<outline.length ? '<a class="next" href="#/lesson/'+key+'/'+un+'/'+(oi+1)+'"><small>השיעור הבא ←</small><span>'+esc(stripLessonPrefix(outline[oi]||""))+'</span></a>' : '';
  if(prev||next) h += '<nav class="pager" aria-label="שיעורים סמוכים">'+prev+next+'</nav>';
  return h;
}

/* ---------- router ---------- */
function route(){
  var hsh = location.hash.replace(/^#\/?/,"");
  var p = hsh.split("/").map(function(x){ try{return decodeURIComponent(x);}catch(e){return x;} });
  try{
    if(p[0]==="plan" && p[1]) renderPlan(p[1]);
    else if(p[0]==="lesson" && p[1]) renderLesson(p[1], parseInt(p[2],10), parseInt(p[3],10));
    else renderHome();
  }catch(e){
    app.innerHTML = '<div class="sheet">'+errorBox("משהו השתבש בהצגת הדף.")+'</div>';
  }
  if(p[0]!=="lesson") window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);
route();
})();
</script>
</body>
